- term: brahmaviharas
  title: Brahmavihārās
  def: "Brahma Vihara meditation, also known as the Four Immeasurables, involves cultivating four qualities: loving-kindness (metta), compassion (karuna), empathetic joy (mudita), and equanimity (upekkha). It aims to develop a state of unconditional love, compassion towards suffering, joy in the happiness of others, and a balanced mind in all situations."
  wiki: Brahmavihara
- term: dmn
  title: DMN
  name: "Default Mode Network (DMN)"
  def: "The default mode network (DMN) is a system of connected brain areas that show increased activity when a person is not focused on what is happening around them, such as during daydreaming and mind-wandering. It can also be active when the individual is thinking about others or themselves, remembering the past, and planning for the future."
  wiki: Default_mode_network
- term: eeg
  title: EEG
  name: "Electroencephalography (EEG)"
  def: An electroencephalogram (EEG) is a recording of brain activity. During this painless test, small sensors are attached to the scalp to pick up the electrical signals produced by the brain.
  wiki: Electroencephalography
- term: flanker_test
  title: Flanker Test
  def: "The flanker test is a cognitive task used to measure interference control—the ability to focus attention on relevant stimuli while suppressing responses to irrelevant distractions. Participants respond to a central target stimulus surrounded by distracting 'flanker' stimuli. Performance on this task reflects the efficiency of controlled and automatic attentional processes."
  wiki: Eriksen_flanker_task
- term: fmri
  title: fMRI
  name: "Functional MRI (fMRI)"
  def: An fMRI (functional Magnetic Resonance Imaging) measures changes in blood flow related to neural activity in the brain, offering insights into brain function and activity patterns.
  wiki: Functional_magnetic_resonance_imaging
- term: gamma
  title: Gamma
  name: "Gamma Waves"
  def: "Gamma brain waves are a type of brainwave pattern that oscillate at approximately 25 to 100 Hz. Gamma waves are associated with states of heightened perception, problem-solving, and consciousness. Gamma waves play a crucial role in cognitive functioning, including memory, and information processing, and are thought to integrate thoughts and information from different parts of the brain."
  wiki: Gamma_wave
- term: inflammation
  title: Inflammation
  def: "Inflammation is a biological response of the immune system to injury, infection, or stress, characterized by the release of signaling molecules called cytokines. Chronic inflammation is linked to impaired cognitive function, increased risk of disease, and accelerated aging."
  wiki: Inflammation
- term: jhana
  title: Jhana
  def: "Jhana refers to states of deep concentration or meditative absorption in Buddhist practice, achieved through intense focus and mindfulness. These states represent progressive levels of mental and emotional calm, clarity, and bliss, cultivated through the practice of meditation, leading to profound insight and enlightenment."
  wiki: Dhyāna_in_Buddhism
- term: mbsr
  title: MBSR
  name: "Mindfulness-Based Stress Reduction (MBSR)"
  def: "Mindfulness-Based Stress Reduction (MBSR) is a program designed to help individuals cope with stress, pain, and illness. Developed by Jon Kabat-Zinn in the 1970s, it combines meditation and yoga to promote awareness and stress management. The eight-week program teaches participants to focus on the present moment non-judgmentally, enhancing their ability to manage difficulties."
  wiki: Mindfulness-based_stress_reduction
- term: randomized_controlled_trial
  title: Randomized Controlled Trial
  def: A Randomized Controlled Trial is a scientific study design that randomly assigns participants to either an experimental group receiving an intervention or a control group, allowing researchers to measure the true effect of the intervention while minimizing bias.
  wiki: Randomized_controlled_trial
- term: telomeres
  title: Telomeres
  def: "Telomeres are protective caps at the end of chromosomes that shorten with each cell division. Telomere length is associated with aging and health, with longer telomeres linked to better health and longevity. Stress and lifestyle factors can affect telomere length, making them a potential marker of health and aging."
  wiki: Telomere
- term: depersonalization
  title: Depersonalization
  def: "Depersonalization is a dissociative experience characterized by feelings of detachment from one's self, body, or mental processes. Individuals experiencing depersonalization may feel like an outside observer of their thoughts, feelings, or body, or they may feel as if they're in a dream. It can occur as a temporary response to stress, as a symptom of psychiatric disorders, or as a feature of certain meditation experiences."
  wiki: Depersonalization
- term: mind_wandering
  title: Mind Wandering
  def: "Mind wandering is the spontaneous shift of attention away from a current task or external environment to internally generated thoughts, memories, or fantasies. This common cognitive process is associated with default mode network activation and has been extensively studied in relation to meditation practices, which often aim to reduce mind wandering."
  wiki: Mind_wandering
- term: mindfulness
  title: Mindfulness
  def: "Mindfulness is the psychological process of purposely bringing one's attention to experiences occurring in the present moment without judgment. It involves maintaining awareness of thoughts, feelings, bodily sensations, and surrounding environment with an attitude of curiosity and acceptance. In meditation contexts, mindfulness practices typically involve focusing attention on the breath or body sensations as anchors to the present moment while acknowledging and releasing distracting thoughts."
  wiki: Mindfulness
- term: beta
  title: Beta
  name: "Beta Waves"
  def: "Beta brain waves are a type of brainwave pattern that oscillate between approximately 12 to 30 Hz. Beta waves are typically associated with active thinking, focus, alertness, and engagement with the external world. They are prominent during conscious, goal-directed activity and are linked to cognitive tasks such as problem-solving, decision-making, and sustained attention."
  wiki: Beta_wave
- term: telomerase
  title: Telomerase
  def: "Telomerase is an enzyme that helps maintain telomere length by adding repetitive DNA sequences to the ends of chromosomes. It plays a crucial role in cellular aging and longevity, as it can counteract the natural shortening of telomeres that occurs with cell division. This enzyme is particularly active in stem cells, germline cells, and cancer cells, while its activity is typically low in most mature somatic cells, contributing to cellular senescence and aging."
  wiki: Telomerase
- term: effect_size
  title: Effect Size
  def: "Effect size is a statistical concept that quantifies the magnitude or strength of a relationship, difference, or intervention outcome. Unlike p-values which only indicate statistical significance, effect sizes measure how meaningful a result is in practical terms. Common measures include Cohen's d (standardized mean difference), correlation coefficients (r), and odds ratios. In meditation research, effect sizes help quantify the practical impact of different meditation practices on psychological or physiological outcomes."
  wiki: Effect_size
- term: vipassana
  title: Vipassana
  def: "Vipassana is a form of Buddhist meditation focused on the cultivation of insight through moment-to-moment awareness of bodily sensations, thoughts, and emotions. It emphasizes non-reactivity and equanimity, helping practitioners observe mental and physical phenomena without attachment."
  wiki: Vipassanā
- term: rem_sleep
  title: REM Sleep
  def: "Rapid Eye Movement (REM) sleep is a sleep stage marked by vivid dreaming, rapid eye movements, and heightened brain activity similar to wakefulness. REM sleep supports emotional regulation, memory consolidation, and neuroplasticity. It typically increases in the later part of the night."
  wiki: Rapid_eye_movement_sleep
- term: adverse_childhood_experiences
  title: Adverse Childhood Experiences (ACEs)
  def: "Adverse childhood experiences are potentially traumatic events that happen before age 18, such as abuse, neglect, or growing up with household substance use or violence. Researchers usually measure them with a short yes/no questionnaire and add up the total. Higher ACE scores are associated with poorer physical and mental health in adulthood, and in meditation research they have been linked to a higher chance of meditation-related adverse effects."
  wiki: Adverse_childhood_experiences
- term: meditation_adverse_effects
  title: Meditation-Related Adverse Effects
  def: "Meditation-related adverse effects are unpleasant experiences that a person attributes to meditation practice, ranging from mild and brief to severe and lasting. Examples include anxiety, re-living traumatic memories, trouble sleeping and feeling disconnected from oneself or the world. Researchers usually record how long each effect lasted and whether it interfered with daily functioning."
- term: cross_sectional_study
  title: Cross-Sectional Study
  def: "A cross-sectional study measures a group of people at a single point in time. It can show which things tend to go together, but not which came first or whether one causes the other."
  wiki: Cross-sectional_study
- term: active_control_group
  title: Active Control Group
  def: "An active control group is a comparison group that takes part in a different program designed to be just as engaging as the one being tested. In meditation research, it might involve exercise, music, or education classes with the same time commitment, teachers, and expectations of benefit. Comparing against an active control helps separate the effects of meditation itself from the general effects of joining a course."
  wiki: Scientific_control
- term: amygdala
  title: Amygdala
  def: "The amygdala is a pair of almond-shaped structures deep in the brain's temporal lobes. It plays a central role in processing emotion, especially threat and fear. Meditation studies often look at how strongly the amygdala responds to emotional images, and sometimes at its size."
  wiki: Amygdala
- term: gray_matter
  title: Gray Matter
  def: "Gray matter is brain tissue made up mostly of nerve cell bodies and their connections. It forms the brain's outer layer (the cortex) and several deeper structures. Structural MRI can estimate gray matter volume (how big a region is), density (how concentrated the tissue is), and cortical thickness (how deep the outer layer is)."
  wiki: Grey_matter
- term: neuroplasticity
  title: Neuroplasticity
  def: "Neuroplasticity is the brain's ability to change its structure and function in response to experience. Changes can include new connections between neurons and shifts in the size of brain regions. Researchers have looked for structural neuroplasticity after meditation training, much as it has been found after exercise or learning new skills."
  wiki: Neuroplasticity
- term: meta_analysis
  title: Meta-Analysis
  def: "A meta-analysis statistically combines the results of many earlier studies on the same question. Pooling the data can estimate an overall effect more precisely than any single study and show whether results agree across studies. Its conclusions are only as good as the studies it includes and how similar they are."
  wiki: Meta-analysis
- term: cbt_i
  title: CBT-I
  name: "Cognitive Behavioral Therapy for Insomnia (CBT-I)"
  def: "Cognitive behavioral therapy for insomnia (CBT-I) is a structured, usually short-term talk therapy for chronic sleeplessness. It combines changes to sleep habits and schedules, such as limiting time in bed, with work on unhelpful thoughts about sleep. It is widely recommended as a first-line treatment for insomnia."
  wiki: Cognitive_behavioral_therapy_for_insomnia
- term: psqi
  title: PSQI
  name: "Pittsburgh Sleep Quality Index (PSQI)"
  def: "The Pittsburgh Sleep Quality Index (PSQI) is a widely used questionnaire about how well a person has slept over the past month. It covers time to fall asleep, sleep duration, disturbances and daytime effects, and combines them into a score from 0 to 21, where higher means worse sleep. Scores above 5 are commonly taken to indicate poor sleep."
  wiki: Pittsburgh_Sleep_Quality_Index
- term: cortical_thickness
  title: Cortical Thickness
  def: "Cortical thickness is the depth of the cerebral cortex, the brain's folded outer layer of gray matter. It is estimated from MRI scans as the distance between the cortex's outer surface and the white matter underneath. Researchers track it over time to look for training-related change, though it can't show what changed at the level of cells."
  wiki: Cortical_thickness
- term: theory_of_mind
  title: Theory of Mind
  def: "Theory of mind is the ability to work out what another person thinks, believes or intends. It is also called mentalizing or cognitive perspective-taking. It is usually distinguished from empathy, which involves sharing another person's feelings rather than reasoning about their thoughts."
  wiki: Theory_of_mind
- term: insula
  title: Insula
  def: "The insula is a region of cortex folded deep inside each side of the brain. It helps represent the body's internal state (interoception) and is involved in emotion, empathy and compassion. Its front part, the anterior insula, comes up often in meditation research."
  wiki: Insular_cortex
- term: alpha
  title: Alpha
  name: "Alpha Waves"
  def: "Alpha waves are rhythmic electrical brain activity at roughly 8–13 cycles per second, recorded with EEG. They are often strongest when the eyes are closed and the mind is relaxed, and are thought to help filter out or hold back information as part of top-down control. Meditation studies have reported both increases and decreases in alpha, depending on the practice."
  wiki: Alpha_wave
- term: functional_connectivity
  title: Functional Connectivity
  def: "Functional connectivity is the degree to which activity in different brain regions rises and falls together over time. It is usually measured with fMRI as the correlation between regions' signals. It shows coordinated activity, not physical wiring. Researchers use it to see how brain networks such as the DMN communicate in different mental states."
  wiki: Functional_connectivity
- term: lempel_ziv_complexity
  title: Lempel-Ziv Complexity
  def: "Lempel-Ziv complexity is a measure of how varied, or unpredictable, a signal is. Applied to EEG, it counts how many distinct patterns appear in a recording: a repetitive signal scores low, and a richly varied one scores high. It is often used as a rough index of brain \"entropy\" and has been found to rise in psychedelic states."
  wiki: Lempel–Ziv_complexity
- term: neurophenomenology
  title: Neurophenomenology
  def: "Neurophenomenology is a research approach that pairs detailed first-person reports of experience with measurements of brain activity, using each to help interpret the other. Proposed by neuroscientist Francisco Varela in the 1990s, it depends on participants who can observe and describe their experience precisely, which makes experienced meditators natural collaborators."
  wiki: Neurophenomenology
- term: il_6
  title: IL-6
  name: "Interleukin-6 (IL-6)"
  def: "Interleukin-6 (IL-6) is a signaling protein (a cytokine) that immune cells release to coordinate inflammation. It is measured from a blood sample, usually in picograms per milliliter. Persistently elevated IL-6 is associated with chronic stress, aging and a higher risk of cardiovascular disease, which makes it a common marker in studies of whether meditation affects health."
  wiki: Interleukin_6
- term: pcc
  title: PCC
  name: "Posterior Cingulate Cortex (PCC)"
  def: "The posterior cingulate cortex (PCC) is a region toward the back of the brain's midline. It is a central hub of the default mode network and tends to be active during self-related thought and mind-wandering. Many meditation studies track PCC activity or connectivity as a window onto the DMN."
  wiki: Posterior_cingulate_cortex
- term: dlpfc
  title: dlPFC
  name: "Dorsolateral Prefrontal Cortex (dlPFC)"
  def: "The dorsolateral prefrontal cortex (dlPFC) is a region on the upper outer sides of the frontal lobes. It is a core part of the brain's executive control network, supporting working memory, directing attention and regulating emotion. Stronger dlPFC activity and connectivity have been associated with lower pain, negative emotion and stress."
  wiki: Dorsolateral_prefrontal_cortex
- term: mediation_analysis
  title: Mediation Analysis
  def: "Mediation analysis is a statistical method that tests whether a third variable helps explain the link between a cause and an effect, for example whether a brain change helps explain why a training program altered a health marker. It estimates how much of the overall effect runs through that variable. A significant result is consistent with a causal pathway but does not prove one on its own."
  wiki: Mediation_(statistics)
- term: nrem_sleep
  title: NREM Sleep
  def: "Non-rapid eye movement (NREM) sleep makes up most of a night's sleep. It runs from light sleep (stages N1 and N2) to deep, slow-wave sleep (N3), alternating with REM sleep in cycles of about 90 minutes. During NREM sleep, brain activity is dominated by slow waves and the brain responds much less to the outside world."
  wiki: Non-rapid_eye_movement_sleep
- term: polysomnography
  title: Polysomnography
  def: "Polysomnography is an overnight sleep study, usually done in a sleep lab. Sensors record brain activity (EEG), eye movements, muscle activity, heart rhythm and breathing, so that each stretch of the night can be scored as wake, light sleep, deep sleep or REM sleep, and sleep disorders such as apnea can be detected."
  wiki: Polysomnography
- term: attention_network_test
  title: Attention Network Test
  def: "The Attention Network Test (ANT) is a short computer task that measures three aspects of attention at once: alerting (getting ready for something about to happen), orienting (moving attention to a location) and executive attention (resolving conflict). People press a key to show which way a central arrow points while arrows on either side point the same way or the opposite way, and cues signal when and where the arrow will appear. Subtracting reaction times between kinds of trials gives a score for each."
  wiki: Attentional_control
- term: poms
  title: POMS
  name: "Profile of Mood States (POMS)"
  def: "The Profile of Mood States (POMS) is a questionnaire in which people rate how strongly they have felt a list of moods. It gives scores on six scales: tension–anxiety, depression–dejection, anger–hostility, fatigue–inertia, confusion–bewilderment and vigor–activity, the only positive one. Researchers use it to track short-term changes in mood, for example before and after a training program."
  wiki: Profile_of_mood_states
- term: cortisol
  title: Cortisol
  def: "Cortisol is a hormone released by the adrenal glands, especially in response to stress. It mobilizes energy and helps regulate the immune system. Because it can be measured in saliva, researchers often use it to gauge how strongly someone reacts to a stressful task, such as timed mental arithmetic. Levels also follow a daily rhythm, so studies try to test everyone at the same time of day."
  wiki: Cortisol
- term: secretory_iga
  title: Secretory IgA
  def: "Secretory immunoglobulin A (sIgA) is the main antibody in saliva, tears and the mucous linings of the gut and airways, where it forms a first line of defense against germs. Because it can be measured from a saliva sample, stress researchers use it as a marker of immune activity."
  wiki: Immunoglobulin_A
- term: mbct
  title: MBCT
  name: "Mindfulness-Based Cognitive Therapy (MBCT)"
  def: "Mindfulness-based cognitive therapy (MBCT) is an 8-week group program that combines mindfulness meditation, adapted from Mindfulness-Based Stress Reduction (MBSR), with elements of cognitive behavioral therapy. It was developed to help people who have recovered from depression avoid relapse, by learning to notice and step back from patterns of negative thinking. Classes usually meet weekly, with daily meditation practice at home."
  wiki: Mindfulness-based_cognitive_therapy
- term: dissociation
  title: Dissociation
  def: "Dissociation is a disruption in the usual integration of thoughts, feelings, perceptions, memory and sense of self. Mild forms, such as daydreaming or 'zoning out', are common. More marked forms include depersonalization (feeling detached from oneself), derealization (feeling that the world is unreal) and emotional numbing. Dissociation can be a response to stress or trauma and is a feature of several psychiatric conditions."
  wiki: Dissociation_(psychology)
- term: derealization
  title: Derealization
  def: "Derealization is an experience in which the outside world feels unreal, distant, dreamlike or flat, as if seen through a fog or a pane of glass. It often occurs together with depersonalization. It can be a passing response to stress, fatigue or anxiety, and it is a symptom of some dissociative and anxiety disorders."
  wiki: Derealization
- term: attentional_blink
  title: Attentional Blink
  def: "The attentional blink is a brief gap in awareness that follows spotting something. When people watch a rapid stream of items for two targets, they often miss the second one if it appears within about half a second of the first, as if attention had blinked while the brain was still taking in the first target. It is thought to arise because the two targets compete for limited attention."
  wiki: Attentional_blink
- term: p3b
  title: P3b
  def: "The P3b is a positive brain wave, recorded with EEG, that peaks over the top and back of the head roughly 300 to 600 milliseconds after a person notices a target they were looking for. It is one part of the P300 response. Researchers use its size as a rough index of how much attention or processing the brain devotes to that target."
  wiki: P300_(neuroscience)
- term: trier_social_stress_test
  title: Trier Social Stress Test
  def: "The Trier Social Stress Test (TSST) is a standard laboratory stressor. After a few minutes to prepare, a person gives a short speech, often a mock job interview, and then does mental arithmetic aloud, in front of a panel of unsmiling judges and often a camera. The mix of public evaluation and lack of control reliably raises stress hormones such as cortisol, so researchers use it to compare how strongly people react to stress."
  wiki: Trier_social_stress_test
- term: capsaicin
  title: Capsaicin
  def: "Capsaicin is the compound that makes chili peppers hot. It activates a receptor (TRPV1) on pain-sensing nerve fibers, producing a burning sensation. In the skin, it also makes those nerves release signaling molecules that widen nearby blood vessels, causing a spreading red flare, so researchers apply capsaicin cream to provoke a small, harmless, nerve-driven inflammation."
  wiki: Capsaicin
- term: neurogenic_inflammation
  title: Neurogenic Inflammation
  def: "Neurogenic inflammation is inflammation driven by nerves rather than by infection or injury alone. When sensory nerve endings are activated, they release signaling molecules called neuropeptides, such as substance P and CGRP, that widen blood vessels, make them leakier and activate local immune cells. It is thought to help explain why stress can worsen skin conditions such as psoriasis and eczema."
  wiki: Neurogenic_inflammation
- term: tnf_alpha
  title: TNF-α
  name: "Tumor Necrosis Factor Alpha (TNF-α)"
  def: "Tumor necrosis factor alpha (TNF-α) is a signaling protein (a cytokine) that immune cells release early in inflammation. It helps fight infection and repair tissue, but high or persistent levels contribute to inflammatory diseases such as rheumatoid arthritis, psoriasis and inflammatory bowel disease."
  wiki: Tumor_necrosis_factor
- term: il_8
  title: IL-8
  name: "Interleukin-8 (IL-8)"
  def: "Interleukin-8 (IL-8) is a signaling protein (a cytokine) that draws white blood cells, especially neutrophils, to a site of infection or injury. Its levels rise in inflamed tissue, so researchers measure it as a marker of local inflammation."
  wiki: Interleukin_8
- term: voxel_based_morphometry
  title: Voxel-Based Morphometry
  def: "Voxel-based morphometry (VBM) is a way of comparing brain structure across MRI scans. Each scan is divided into a grid of tiny cubes called voxels (3D pixels). Software labels the tissue in each voxel as gray matter, white matter or fluid, and warps every brain to a standard shape so that the same voxel falls in roughly the same place in each person. Researchers then test, voxel by voxel, whether gray matter density (how much of the tissue there looks like gray matter) or volume differs between groups or changes over time."
  wiki: Voxel-based_morphometry
- term: hippocampus
  title: Hippocampus
  def: "The hippocampus is a curved structure deep in each temporal lobe of the brain. It is essential for learning and forming new memories, and it also helps regulate emotion and the stress response. It can change with experience, and it tends to be smaller in people with long-term depression or post-traumatic stress disorder."
  wiki: Hippocampus
- term: tpj
  title: TPJ
  name: "Temporoparietal Junction (TPJ)"
  def: "The temporoparietal junction (TPJ) is the area where the brain's temporal and parietal lobes meet, toward the back and side of the head. It helps combine signals from the body and senses into a sense of where the self is, and it is central to theory of mind: working out what other people think and intend."
  wiki: Temporoparietal_junction
- term: multiple_comparisons
  title: Multiple Comparisons
  def: "The multiple comparisons problem arises when researchers run many statistical tests at once. Each test has a small chance of a false positive, so across thousands of tests, such as one for every point in a brain scan, some \"significant\" results will turn up by chance alone. Corrections raise the bar for significance to keep the overall false-positive rate down, at the cost of making small real effects harder to detect."
  wiki: Multiple_comparisons_problem
- term: odds_ratio
  title: Odds Ratio
  def: "An odds ratio compares the odds of an outcome in one group with the odds in another, where the odds are the chance something happens divided by the chance it doesn't. An odds ratio of 1 means no difference, above 1 means higher odds in the first group, and below 1 lower odds. When an outcome is common, an odds ratio looks bigger than the difference in percentages: 30% versus 20% is an odds ratio of about 1.7."
  wiki: Odds_ratio
- term: repetitive_negative_thinking
  title: Repetitive Negative Thinking
  def: "Repetitive negative thinking is a habit of dwelling on problems and negative experiences, through worry about the future or rumination about the past, in a way that feels hard to stop and gets nowhere. It is common across many mental health problems, especially depression and anxiety. Researchers often measure it with the Perseverative Thinking Questionnaire."
  wiki: Perseverative_cognition
- term: theta
  title: Theta
  name: "Theta Waves"
  def: "Theta waves are rhythmic electrical brain activity at roughly 4–8 cycles per second, recorded with EEG. While awake, they are linked to memory, focused attention and drowsiness, and meditation studies often report more theta over the front of the head during practice. In sleep, theta is common in light non-REM sleep and in REM sleep."
  wiki: Theta_wave
- term: sleep_spindle
  title: Sleep Spindle
  def: "A sleep spindle is a brief burst of brain activity at about 11–16 cycles per second (the sigma band), lasting from about half a second to two seconds, seen on an EEG during non-REM sleep, especially stage N2. Spindles are thought to help shield sleep from outside noise and to support memory consolidation, and they can increase locally in brain areas used heavily for learning during the day."
  wiki: Sleep_spindle
- term: slow_wave_activity
  title: Slow-Wave Activity
  def: "Slow-wave activity (SWA) is the strength of the slowest brain rhythms of sleep, delta waves at about 1–4 cycles per second, measured with EEG. Slow waves dominate deep (N3) non-REM sleep. SWA is highest early in the night and falls as sleep goes on, and brain areas that worked hard during the day can show more of it that night, which makes it a marker of both sleep pressure and learning-related changes in the brain."
  wiki: Slow-wave_sleep
- term: shamatha
  title: Shamatha
  def: "Shamatha (Pali samatha, \"calm abiding\") is a Buddhist family of concentration practices that train attention to settle and stay on a chosen object, such as the sensations of the breath. Practitioners notice when the mind has wandered and bring it back, aiming for attention that is both stable and vivid. It is often paired with vipassana, or insight, practice."
  wiki: Samatha
- term: vigilance_decrement
  title: Vigilance Decrement
  def: "The vigilance decrement is the decline in performance as time goes on during a long, monotonous task that requires watching for rare targets, such as a radar operator looking for a blip. People typically miss more targets or make more false alarms after only a few minutes. It is the standard laboratory measure of how well sustained attention holds up."
  wiki: Vigilance_(psychology)
- term: wait_list_control
  title: Wait-List Control Group
  def: "A wait-list control group is a comparison group that receives the program being studied only after the study period, so participants who are waiting can be compared with those already taking part. It controls for the passage of time and repeated testing, but not for the attention, expectations and setting that come with taking part in any program, which an active control group can address."
  wiki: Waitlist_control_group
- term: lojong
  title: Lojong
  def: "Lojong, Tibetan for \"mind training,\" is a set of Tibetan Buddhist practices for cultivating compassion, traced to the Indian teachers Atisha and Shantideva. Rather than simply observing thoughts, it uses reasoning and reflection to question habitual attitudes toward oneself and others, such as sorting people into friends, enemies and strangers, and to extend warmth step by step to a widening circle of people, including those one dislikes."
  wiki: Lojong
- term: sleep_efficiency
  title: Sleep Efficiency
  def: "Sleep efficiency is the share of time in bed actually spent asleep: total sleep time divided by time in bed, given as a percentage. It can be measured in a sleep lab or estimated from sleep diaries or wrist-worn devices. Taking a long time to fall asleep or lying awake during the night lowers it, and values below about 85–90% are often taken as a sign of disturbed sleep."
  wiki: Sleep_efficiency
- term: slow_wave_sleep
  title: Slow-Wave Sleep
  def: "Slow-wave sleep (SWS), often called deep sleep, is the deepest stage of non-REM sleep (stage N3, or stages 3 and 4 under older scoring rules), when the EEG is dominated by large, slow delta waves. People are hardest to wake from it. It is concentrated in the first part of the night, declines with age, and is thought to support physical restoration and memory."
  wiki: Slow-wave_sleep
- term: self_selection_bias
  title: Self-Selection Bias
  def: "Self-selection bias arises when people decide for themselves whether to take part in a study, so those who do may differ from those who don't in ways that affect the results. A survey advertised as being about the unwanted effects of meditation, for example, may draw more people who have had such effects, making them look more common than they are among meditators in general."
  wiki: Self-selection_bias
- term: gene_expression
  title: Gene Expression
  def: "Gene expression is the process by which a cell reads a gene and uses it to make a product, usually by copying it into a messenger molecule (mRNA) that is then used to build a protein. Every cell carries the same DNA, but cells turn genes up and down within hours in response to signals such as hormones, infection or stress. Researchers often measure a gene's mRNA to see how active it is; that says nothing about the DNA sequence itself, which doesn't change."
  wiki: Gene_expression
- term: epigenetics
  title: Epigenetics
  def: "Epigenetics is the study of chemical marks on DNA, and on the histone proteins it is wound around, that help switch genes on or off without changing the DNA sequence. Examples include DNA methylation and the acetylation of histones. Some marks change within hours in response to the environment and others last for years, which makes them a candidate link between experience and health."
  wiki: Epigenetics
- term: histone_deacetylase
  title: Histone Deacetylase
  def: "Histone deacetylases (HDACs) are enzymes that remove small chemical tags called acetyl groups from histones, the spool-like proteins that DNA is wound around, and from other proteins. Removing these tags generally packs DNA more tightly, making nearby genes harder to read. Drugs that block HDACs (HDAC inhibitors) are used to treat some cancers and are being studied as anti-inflammatory treatments."
  wiki: Histone_deacetylase
- term: psoriasis
  title: Psoriasis
  def: "Psoriasis is a long-lasting immune-related skin disease in which skin cells multiply far faster than normal, building up into raised, red, scaly patches called plaques, often on the elbows, knees, scalp and trunk. It tends to come and go in flare-ups, which many patients say stress can trigger. It affects roughly 1–3% of people and can be treated, but not cured, with creams, ultraviolet light therapy and drugs that act on the immune system."
  wiki: Psoriasis
- term: phototherapy
  title: Phototherapy (UVB and PUVA)
  def: "Ultraviolet phototherapy treats skin diseases such as psoriasis by exposing the skin to controlled doses of ultraviolet light, usually in a booth several times a week, slowing the overgrowth of skin cells and calming inflammation. UVB therapy uses ultraviolet B light alone. PUVA (psoralen plus UVA) combines a light-sensitizing drug, psoralen, with ultraviolet A light and is often used for more severe or stubborn cases. Long courses raise the risk of skin cancer."
  wiki: Ultraviolet_light_therapy
- term: hazard_ratio
  title: Hazard Ratio
  def: "A hazard ratio compares how fast an event happens in two groups over time, such as recovery or death, at any given moment among the people it hasn't happened to yet. A hazard ratio of 2 means the event is happening at twice the rate in one group as in the other; 1 means no difference. It comes from survival analysis (often a Cox proportional hazards model), which can include people who leave a study early by counting the time they were followed."
  wiki: Hazard_ratio
- term: working_memory
  title: Working Memory
  def: "Working memory is the small, short-lived mental workspace that holds information while you use it, such as a phone number you are about to dial or the running total of a sum done in your head. It holds only a few items at once and depends on attention, so a distraction or a wandering mind can quickly empty it. Psychologists measure it with tasks such as digit span and the n-back."
  wiki: Working_memory
- term: n_back
  title: N-Back Task
  def: "The n-back task is a working memory test in which people watch a stream of items, such as letters, and say whether each one matches the item a set number of steps back (two steps in a 2-back task). Doing it well means constantly updating what you hold in mind while letting go of older items, so it demands steady attention."
  wiki: N-back
- term: stai
  title: State Anxiety Inventory
  def: "The State Anxiety Inventory is the half of the State-Trait Anxiety Inventory (STAI) that asks how anxious someone feels right now, rather than how anxious they tend to be in general. People rate 20 statements such as \"I feel worried\" from 1 (not at all) to 4 (very much so), giving a score from 20 to 80. Because it captures the moment, researchers can give it just before and just after a single session."
  wiki: State-Trait_Anxiety_Inventory
- term: study_heterogeneity
  title: Heterogeneity
  def: "In a meta-analysis, heterogeneity is how much the results of the pooled studies differ from one another beyond what chance alone would produce, for example because they enrolled different people or compared the treatment with different things. It is often summarized by the I² statistic, the share of the variation due to real differences between studies; values of 50% or more are usually read as substantial. High heterogeneity makes a single pooled number harder to interpret."
  wiki: Study_heterogeneity
- term: publication_bias
  title: Publication Bias
  def: "Publication bias arises when studies with positive or striking results are more likely to be published than studies that find nothing. A meta-analysis that pools only published studies can then overestimate how well a treatment works. Researchers check for it with tools such as funnel plots and Egger's test, which need a reasonable number of studies to be informative."
- term: white_matter
  title: White Matter
  def: "White matter is brain tissue made up mostly of long nerve fibers (axons), many wrapped in a fatty insulating layer called myelin that gives the tissue its pale color. It forms the wiring that connects regions of gray matter, within each hemisphere and between the two. In living people it is usually studied with diffusion MRI."
  wiki: White_matter
- term: diffusion_tensor_imaging
  title: Diffusion Tensor Imaging
  def: "Diffusion tensor imaging (DTI) is an MRI method that tracks how water molecules move through brain tissue. In white matter, water moves more easily along nerve fibers than across them, so DTI can map fiber pathways and estimate their structure. Its most common measure, fractional anisotropy, is often read as a sign of how intact or organized the fibers are, though several different things can change it."
  wiki: Diffusion-weighted_magnetic_resonance_imaging
- term: anterior_cingulate_cortex
  title: Anterior Cingulate Cortex
  def: "The anterior cingulate cortex (ACC) is a strip of cortex on the inner surface of each frontal lobe, curving around the front of the corpus callosum. It is involved in monitoring conflicts and errors, regulating attention and emotion, and processing pain, and it often turns up in brain-imaging studies of meditation."
  wiki: Anterior_cingulate_cortex
- term: transcendental_meditation
  title: Transcendental Meditation
  def: "Transcendental Meditation (TM) is a trademarked form of mantra meditation taught through a standardized course by certified teachers. Practitioners sit with eyes closed for about 20 minutes twice a day, silently repeating a mantra (a sound or word) in a way meant to be effortless, letting the mind settle rather than holding attention on an object. Researchers usually group it with other mantra-based techniques, separate from mindfulness meditation."
  wiki: Transcendental_Meditation
- term: confidence_interval
  title: Confidence Interval
  def: "A confidence interval is the range of values that a study's data are consistent with, given the uncertainty that comes from measuring a limited sample. A 95% confidence interval for an effect of 0.30 running from 0.00 to 0.59, for example, means the true effect could plausibly be anywhere from nothing to moderate. Narrower intervals mean more precise estimates; an interval that includes zero means the study can't rule out no effect."
  wiki: Confidence_interval
- term: perceived_stress_scale
  title: Perceived Stress Scale
  def: "The Perceived Stress Scale (PSS) is a widely used questionnaire that asks how often, over the past month, people have felt their lives were unpredictable, out of control or overloaded. It comes in 14-, 10- and 4-item versions, each answered from never (0) to very often (4); higher totals mean more stress. It measures how stressed people feel, not physical signs of stress such as hormone levels."
  wiki: Perceived_Stress_Scale
- term: region_of_interest
  title: Region of Interest
  def: "In brain imaging, a region of interest (ROI) is an area chosen in advance for testing, such as the amygdala or hippocampus, usually because earlier research points to it. Limiting the main test to one region means fewer statistical comparisons, so real effects there are easier to detect. The trade-off is that the test says nothing about the rest of the brain, so ROI studies often add a separate, exploratory whole-brain search."
  wiki: Region_of_interest
- term: meg
  title: MEG
  name: "Magnetoencephalography (MEG)"
  def: "Magnetoencephalography (MEG) records the tiny magnetic fields produced by electrical activity in the brain, using very sensitive sensors in a helmet-shaped device. Like EEG, it tracks brain activity millisecond by millisecond, but because magnetic fields pass through the skull with little distortion, it can usually locate where in the brain the activity comes from more accurately."
  wiki: Magnetoencephalography
- term: mpfc
  title: mPFC
  name: "Medial Prefrontal Cortex (mPFC)"
  def: "The medial prefrontal cortex (mPFC) is the part of the frontal lobes along the brain's midline, just behind the forehead. It is a core part of the default mode network and is consistently active when people think about themselves, judge their own traits, or recall and plan events in their own lives."
  wiki: Prefrontal_cortex
- term: inferior_parietal_lobule
  title: Inferior Parietal Lobule
  def: "The inferior parietal lobule (IPL) is a region on the outer surface of the parietal lobe, toward the back and side of the head. It combines information from the senses and the body and is involved in attention, language, the sense of being the one who causes one's own actions (agency), and telling oneself apart from others."
  wiki: Inferior_parietal_lobule
- term: intention_to_treat
  title: Intention-to-Treat Analysis
  def: "An intention-to-treat analysis counts every randomized participant in the group they were assigned to, whether or not they completed or even started the treatment. It keeps the benefit of randomization, since dropping people who didn't follow their plan can leave groups that differ in other ways, and it estimates what happens when a treatment is offered in practice rather than when it is taken exactly as intended."
  wiki: Intention-to-treat_analysis
- term: qaly
  title: Quality-Adjusted Life Year (QALY)
  def: "A quality-adjusted life year (QALY) is a measure used in health economics that combines how long people live with how well they live. A year in full health counts as 1 QALY, and a year in poorer health counts as less, based on questionnaires such as the EQ-5D. Dividing a treatment's extra cost by the QALYs it gains shows whether it is good value compared with other options."
  wiki: Quality-adjusted_life_year
- term: precuneus
  title: Precuneus
  def: "The precuneus is a region on the inner surface of the parietal lobe, toward the back of the brain's midline, next to the posterior cingulate cortex. Together they form a core hub of the default mode network, and the precuneus is often active during self-related thinking, memory recall and imagining one's own point of view."
  wiki: Precuneus
- term: individual_patient_data
  title: Individual Patient Data Meta-Analysis
  def: "An individual patient data (IPD) meta-analysis pools the raw records of every participant from several trials, rather than the summary results each trial published. Re-analyzing everyone together, the same way, lets researchers ask whether a treatment works better for some kinds of patients than others. It depends on the original trial teams sharing their data, which isn't always possible."
  wiki: Individual_participant_data
- term: p300
  title: P300
  def: "The P300 is a positive brain wave, recorded with EEG, that peaks roughly 300 to 600 milliseconds after something rare or meaningful appears, such as a target a person is watching for or a striking, personally relevant picture. It tends to be larger for things that draw more attention, so researchers use its size as a rough index of how much processing the brain gives a stimulus. It has several parts, including the P3a and the P3b."
  wiki: P300_(neuroscience)
- term: event_related_potential
  title: Event-Related Potential
  def: "An event-related potential (ERP) is the brain's electrical response to a specific event, such as a picture appearing on a screen, recorded with EEG. The response to a single event is tiny compared with the rest of the brain's activity, so researchers repeat the event many times and average the recordings until the consistent response stands out as a series of positive and negative waves at typical delays."
  wiki: Event-related_potential
- term: oddball_paradigm
  title: Oddball Task
  def: "An oddball task shows a long stream of frequent, ordinary stimuli interrupted now and then by rare ones. Some rare stimuli are targets that call for a response, such as a button press; others are distracters to be ignored. Rare stimuli trigger a P300 brain response that the frequent ones don't, which makes the task a standard way to study attention with EEG."
  wiki: Oddball_paradigm
- term: loving_kindness
  title: Loving-Kindness Meditation
  def: "Loving-kindness meditation (mettā in Pali) is a Buddhist practice of deliberately cultivating warm, unconditional goodwill. Practitioners silently repeat wishes such as \"may you be happy\" or picture a person, usually starting with themselves or someone close and then extending the wishes to acquaintances, strangers, difficult people and all beings. It is one of the four brahmaviharas."
  wiki: Mettā
- term: self_compassion
  title: Self-Compassion
  def: "Self-compassion means treating yourself with the kindness you would offer a friend when you fail or suffer. In psychologist Kristin Neff's widely used definition it has three parts: kindness toward oneself rather than harsh judgment, seeing one's difficulties as part of shared human experience rather than as isolating, and mindful awareness of painful feelings without being swept away by them. It is usually measured with Neff's Self-Compassion Scale."
  wiki: Self-compassion
- term: ecological_momentary_assessment
  title: Ecological Momentary Assessment
  def: "Ecological momentary assessment (EMA), also called experience sampling, asks people to report what they are feeling or doing several times a day, in the moment and in their everyday surroundings, usually through short surveys sent to their phones at set or random times. Because answers are given on the spot rather than recalled later, they are less colored by memory than questionnaires about the past week or month, and they can show how experiences rise and fall through the day."
  wiki: Experience_sampling_method
- term: cbt
  title: CBT
  name: "Cognitive Behavioral Therapy (CBT)"
  def: "Cognitive behavioral therapy (CBT) is a structured, usually short-term talk therapy that helps people notice and change unhelpful patterns of thinking and behavior. It is one of the most thoroughly tested psychological treatments and a first-line option for depression, anxiety disorders and many other conditions."
  wiki: Cognitive_behavioral_therapy
- term: bystander_effect
  title: Bystander Effect
  def: "The bystander effect is the finding that people are less likely to help someone in need when other people are present, especially when those others do nothing. Each person may feel less responsible, or take the others' inaction as a sign that help isn't needed. Experiments often recreate it with actors who are told to ignore the person in need."
  wiki: Bystander_effect
- term: demand_characteristics
  title: Demand Characteristics
  def: "Demand characteristics are cues in an experiment that hint at what the researchers expect, which can lead participants to behave the way they think they are supposed to rather than how they normally would. Researchers reduce them by disguising the study's purpose, measuring behavior unobtrusively, or using comparison conditions that seem just as plausible."
  wiki: Demand_characteristics
- term: empathic_accuracy
  title: Empathic Accuracy
  def: "Empathic accuracy is how well a person can correctly infer what someone else is thinking or feeling. Researchers often measure it with tests that ask people to identify the emotion shown in photographs of faces, recordings of voices or videos, and score how many they get right. It is a skill of perception, distinct from caring about the other person's feelings."
  wiki: Empathic_accuracy
- term: broaden_and_build
  title: Broaden-and-Build Theory
  def: "The broaden-and-build theory, proposed by psychologist Barbara Fredrickson in 1998, holds that positive emotions such as joy, interest and love briefly widen the range of thoughts and actions that come to mind. Over time, that broadened outlook is said to help people build lasting personal resources, such as skills, relationships, resilience and health, that serve them well later."
  wiki: Broaden-and-build
- term: hedonic_treadmill
  title: Hedonic Treadmill
  def: "The hedonic treadmill (or hedonic adaptation) is the tendency for people to get used to good and bad changes in their lives and drift back toward their usual level of happiness. A raise, a new purchase or a pleasant routine may lift mood at first, but the lift tends to fade as it becomes familiar."
  wiki: Hedonic_treadmill
- term: regression_to_the_mean
  title: Regression to the Mean
  def: "Regression to the mean is the tendency for unusually high or low measurements to be followed by ones closer to average, because part of any single measurement is chance. People who score as very stressed on a questionnaire one week will, on average, score a little less stressed the next, with or without treatment. In a trial, a group that happens to start out worse can therefore seem to improve more, which is one reason researchers compare against a control group and adjust for starting scores."
  wiki: Regression_toward_the_mean
- term: prediction_interval
  title: Prediction Interval
  def: "In a meta-analysis, a prediction interval is the range within which the true effect in a new study, run in a new setting, is likely to fall. A confidence interval describes how precisely the average effect across studies is known, and it narrows as studies accumulate. A prediction interval also takes in how much the effect genuinely varies from one setting to another, so it is wider when studies disagree. If it crosses zero, some settings may see no benefit, or even harm, even when the average effect is clearly positive."
  wiki: Prediction_interval
- term: grade_evidence
  title: GRADE
  name: "GRADE Evidence Ratings"
  def: "GRADE (Grading of Recommendations Assessment, Development and Evaluation) is a widely used system for rating how much confidence to place in a body of evidence. Reviewers rate each finding as high, moderate, low or very low certainty, downgrading it for problems such as risk of bias in the studies, inconsistent results, imprecise estimates, indirect evidence and signs that unfavorable results went unpublished. Low certainty means the true effect may be substantially different from the estimate."
  wiki: GRADE_approach
- term: pragmatic_trial
  title: Pragmatic Trial
  def: "A pragmatic trial tests how well a treatment works in everyday practice, with ordinary participants, settings and levels of attendance, rather than under the tightly controlled conditions of an explanatory trial. It shows whether offering a program helps the people it is offered to, but it usually compares the program with usual care, so it can't say which parts of the program caused any benefit."
  wiki: Pragmatic_clinical_trial
- term: number_needed_to_treat
  title: Number Needed to Treat
  def: "The number needed to treat (NNT) is how many people need to receive a treatment, or be offered it, for one more of them to avoid a bad outcome than would have without it. It is 1 divided by the difference in the share of each group that has the outcome: if 30% of an untreated group and 20% of a treated group have it, the NNT is 1 / 0.10, or 10. Lower numbers mean a bigger practical effect."
  wiki: Number_needed_to_treat
- term: meta_awareness
  title: Meta-Awareness
  def: "Meta-awareness is awareness of what the mind is doing as it happens: noticing that you are having a thought, feeling an emotion or have drifted into mind wandering, rather than simply being caught up in it. It is a form of metacognition. Mindfulness practices train it directly, for example each time a meditator notices the mind has wandered and brings attention back."
  wiki: Metacognition
- term: central_executive_network
  title: Central Executive Network
  def: "The central executive network (also called the frontoparietal control network) is a set of brain regions in the lateral prefrontal and parietal cortex, including the dorsolateral prefrontal cortex. It is active during demanding, goal-directed tasks, supporting working memory, directing attention and regulating emotion, and it tends to work in opposition to the default mode network."
  wiki: Central_executive_network
- term: act
  title: Acceptance and Commitment Therapy (ACT)
  def: "Acceptance and commitment therapy (ACT) is a form of psychotherapy that combines mindfulness and acceptance with values-based action. Rather than trying to change or get rid of difficult thoughts and feelings, people learn to notice and make room for them, clarify what matters to them, and commit to acting on those values."
  wiki: Acceptance_and_commitment_therapy
- term: nondual_awareness
  title: Nondual Awareness
  def: "Nondual awareness is a style of meditation, found in Tibetan Buddhism and other contemplative traditions, that does not focus on any particular object or experience. Instead the meditator rests in awareness itself, without splitting experience into an observing subject and the things observed, or into inner and outer. It is usually described as effortless, in contrast with practices that deliberately direct attention."
  wiki: Nondualism
- term: task_positive_network
  title: Task-Positive Network
  def: "The task-positive network is a set of brain regions, including sensory, attention and parietal areas, that become more active when a person is engaged with an external, attention-demanding task. Its activity tends to rise when the default mode network's falls, and vice versa, so the two are often described as anticorrelated or competing."
  wiki: Task-positive_network
- term: decentering
  title: Decentering
  def: "Decentering is the ability to observe thoughts, feelings and memories as passing events in the mind rather than as facts about reality or fixed parts of who you are: noticing \"I'm having the thought that I'll fail\" rather than simply believing \"I'll fail.\" It is thought to be one of the ways mindfulness-based programs and cognitive therapies work, and is usually measured by questionnaire, for example with the Experiences Questionnaire."
- term: generalized_anxiety_disorder
  title: Generalized Anxiety Disorder (GAD)
  def: "Generalized anxiety disorder (GAD) is an anxiety disorder marked by excessive, hard-to-control worry about many everyday matters, such as health, work or family, lasting at least six months. The worry comes with physical and mental symptoms such as restlessness, tiring easily, trouble concentrating, irritability, muscle tension and poor sleep."
  wiki: Generalized_anxiety_disorder
- term: bootstrapping
  title: Bootstrapping
  name: "Bootstrapping (Statistics)"
  def: "Bootstrapping is a statistical technique that gauges how uncertain a result is by resampling the data. It draws thousands of new samples of the same size from the original participants (with replacement), recalculates the result in each, and uses the spread of those results to build a confidence interval. It makes fewer assumptions about the shape of the data than traditional tests and is commonly used to test indirect effects in mediation analysis."
  wiki: Bootstrapping_(statistics)
- term: vmpfc
  title: vmPFC
  name: "Ventromedial Prefrontal Cortex (vmPFC)"
  def: "The ventromedial prefrontal cortex (vmPFC) is the lower part of the frontal lobes along the brain's midline, just above the eyes. Together with the neighboring medial orbitofrontal cortex and the subgenual (lower) part of the anterior cingulate, it helps weigh how much something matters to oneself, represents reward and value, and links emotions with the body's internal states."
  wiki: Ventromedial_prefrontal_cortex
- term: angular_gyrus
  title: Angular Gyrus
  def: "The angular gyrus is a region in the back of the parietal lobe, part of the inferior parietal lobule, where information from vision, hearing and touch comes together. It is involved in language, attention, memory and in taking perspectives, including switching between seeing a situation from one's own point of view and from the outside."
  wiki: Angular_gyrus
- term: dorsal_attention_network
  title: Dorsal Attention Network
  def: "The dorsal attention network (DAN) is a set of brain regions toward the top of the parietal lobes (around the intraparietal sulcus) and in the frontal lobes (the frontal eye fields). It directs attention voluntarily toward whatever a person has chosen to focus on, especially in the outside world, and its activity tends to rise and fall in opposition to the default mode network."
  wiki: Dorsal_attention_network
- term: heart_rate_variability
  title: Heart Rate Variability
  def: "Heart rate variability (HRV) is the natural variation in time between one heartbeat and the next, calculated from an ECG or a pulse sensor. Higher HRV at rest usually reflects a stronger parasympathetic (\"rest and digest\") influence on the heart and is generally linked to relaxation, better health and more flexible responses to stress."
  wiki: Heart_rate_variability
- term: mahamudra
  title: Mahāmudrā
  def: "Mahāmudrā (Sanskrit for \"great seal\") is a body of teachings and meditation practices in Tibetan Buddhism, central to the Kagyü school. It aims at direct recognition of the nature of the mind itself, often described as open, clear awareness that is not centered on a self."
  wiki: Mahamudra
- term: sense_of_agency
  title: Sense of Agency
  def: "The sense of agency is the feeling of being the one who initiates and controls an action, such as moving your hand or, in meditation, directing your attention. It is usually so constant that it goes unnoticed, but it can weaken or disappear in some psychiatric and neurological conditions and in some deep meditative states."
  wiki: Sense_of_agency
- term: principal_component_analysis
  title: Principal Component Analysis
  def: "Principal component analysis (PCA) is a statistical method that looks for a small number of underlying dimensions that account for most of the variation in many related measurements. If several measures rise and fall together, PCA can show that they largely reflect one shared factor."
  wiki: Principal_component_analysis
- term: inter_rater_reliability
  title: Inter-Rater Reliability
  def: "Inter-rater reliability is how closely two or more people agree when they independently rate or classify the same material, such as interview transcripts. Measures such as Cohen's kappa correct for the agreement expected by chance: 0 means chance-level agreement and 1 perfect agreement."
  wiki: Inter-rater_reliability
- term: body_scan
  title: Body Scan
  def: "The body scan is a meditation practice in which attention is moved slowly through the body, part by part, noticing whatever sensations are present without trying to change them. It is a core exercise in mindfulness programs such as MBSR."
  wiki: Body_scan
- term: interoception
  title: Interoception
  def: "Interoception is the sense of the body's internal state: feeling your heartbeat, breathing, hunger, warmth, tension and other sensations from inside the body. Interoceptive awareness is how much attention a person pays to these signals. Practices such as the body scan, which moves attention through the body part by part, aim to strengthen it."
  wiki: Interoception
- term: psychedelic_drug
  title: Psychedelic Drugs
  def: "Classic psychedelics are drugs such as psilocybin (the active compound in \"magic mushrooms\"), LSD, mescaline and DMT that profoundly alter perception, emotion and the sense of self, mainly by stimulating the brain's serotonin 2A receptors. They are being studied as possible treatments for conditions such as depression and addiction, mostly in carefully controlled clinical settings, and are controlled substances in most countries."
  wiki: Psychedelic_drug
- term: ego_dissolution
  title: Ego Dissolution
  def: "Ego dissolution (also called ego death) is a temporary loss of the ordinary sense of being a separate self, often described as the boundary between self and world melting away, sometimes with a feeling of oneness. It is reported at high doses of psychedelic drugs and in some deep meditative states, and researchers usually measure it with questionnaires."
  wiki: Ego_death
- term: samadhi
  title: Samadhi
  def: "Samadhi is a state of deep meditative absorption, or one-pointed concentration, described in Hindu and Buddhist traditions. In Buddhism it is closely tied to the jhanas, a series of increasingly refined absorption states. Its deepest stages are described as having almost no content: no thoughts, no pleasure or pain, and no sense of an individual self."
  wiki: Samadhi
- term: extinction
  title: Extinction (Learning)
  def: "In psychology, extinction is the fading of a learned reaction when its trigger stops predicting what it used to, for example when a place once linked with danger is repeatedly experienced as safe. Extinction doesn't erase the original memory; it adds new learning that competes with it, which is why old fears can return. Exposure therapies for anxiety rely on it."
  wiki: Extinction_(psychology)
- term: memory_reconsolidation
  title: Memory Reconsolidation
  def: "Memory reconsolidation is the process by which a memory, when recalled, briefly becomes changeable before it is stored again. During that window it can be updated, weakened or linked to new associations. Researchers study it as a way to change emotional memories, for example in anxiety and addiction."
  wiki: Memory_reconsolidation
- term: tummo
  title: g-Tummo
  name: "g-Tummo (Tummo)"
  def: "g-Tummo, often written tummo and known in English as \"inner fire\" or \"psychic heat,\" is a meditation practice of Tibetan Buddhism and Bön associated with sensations of intense bodily heat. It combines a breath-holding technique with muscle contractions (\"vase breathing\") and visualization of flames in the body, and it is traditionally taught in long retreats."
  wiki: Tummo
- term: isometric_exercise
  title: Isometric Exercise
  def: "An isometric exercise tenses muscles without moving the joints they act on, as in holding a plank or pressing the palms together. The muscles work and produce heat even though the body stays still."
  wiki: Isometric_exercise
- term: thermogenesis
  title: Thermogenesis
  def: "Thermogenesis is the body's production of heat. Muscle activity, including shivering and other muscle contractions, is a major source; the body also makes heat by burning fuel in brown fat and through digestion."
  wiki: Thermogenesis
- term: delta
  title: Delta
  name: "Delta Waves"
  def: "Delta waves are the slowest rhythmic electrical brain activity recorded with EEG, at roughly 0.5–4 cycles per second. They dominate deep (slow-wave) sleep and also appear under general anesthesia, so more delta while awake can be a sign of drowsiness. Smaller amounts are present in waking EEG, where they have also been linked to attention and internal processing."
  wiki: Delta_wave
- term: false_discovery_rate
  title: False Discovery Rate
  def: "The false discovery rate (FDR) is the expected share of false positives among the results a study declares significant. FDR corrections, such as the Benjamini–Hochberg method, are a common way to handle multiple comparisons. They are less strict than corrections that try to avoid even a single false positive (such as Bonferroni), so they miss fewer real effects, while accepting that a small fraction of the reported findings may be due to chance."
  wiki: False_discovery_rate
- term: dynamic_functional_connectivity
  title: Dynamic Functional Connectivity
  def: "Dynamic functional connectivity tracks how the coordination between brain regions changes from moment to moment, rather than averaging it over a whole scan. Researchers typically measure connectivity in short, sliding windows of fMRI data, then group similar windows into a few recurring patterns, often called brain states, and count how often each appears and how long it lasts."
  wiki: Dynamic_functional_connectivity
- term: thalamus
  title: Thalamus
  def: "The thalamus is a pair of egg-shaped structures deep in the middle of the brain that relay sensory signals (from everything except smell) and motor signals to the cerebral cortex. It acts as a gatekeeper, helping decide which information reaches the cortex, and also plays a part in regulating sleep, wakefulness and attention."
  wiki: Thalamus
- term: tukdam
  title: Tukdam
  def: "Tukdam (Tibetan thugs dam, also spelled thukdam) is a state that Tibetan Buddhists believe some advanced meditators enter at death, remaining in meditation after breathing has stopped. According to the tradition, the body of someone in tukdam stays fresh, with supple skin and warmth around the heart, and doesn't begin to decay for days or even weeks. The state is understood to have ended when signs of decomposition appear."
  wiki: Tukdam
- term: mismatch_negativity
  title: Mismatch Negativity
  def: "The mismatch negativity (MMN) is a brain response, recorded with EEG, to a sound that breaks a repeating pattern, such as a change in pitch after a run of identical tones. It shows up as a negative dip roughly 100 to 300 milliseconds after the odd sound and arises automatically, even when the person isn't paying attention, so it is used to test whether the brain still processes sound during sleep, in coma or in a vegetative state."
  wiki: Mismatch_negativity
- term: auditory_brainstem_response
  title: Auditory Brainstem Response
  def: "The auditory brainstem response (ABR) is a series of tiny electrical waves, recorded from the scalp, that the hearing nerve and brainstem produce within about 10 milliseconds of a click. Because it doesn't depend on attention or awareness, it is used to test hearing in newborns and to check whether the brainstem is still working in people in a deep coma or suspected of brain death."
  wiki: Auditory_brainstem_response
- term: out_of_body_experience
  title: Out-of-Body Experience
  def: "An out-of-body experience (OBE) is the feeling of being located outside one's own physical body, often seeing it from above or from across the room. OBEs are reported in deep meditation, near-death experiences, sleep paralysis and some neurological conditions, and can be triggered by stimulating the temporoparietal junction, a region that helps place the sense of self in the body."
  wiki: Out-of-body_experience
- term: cerebellum
  title: Cerebellum
  def: "The cerebellum (\"little brain\") is a densely packed structure at the back of the brain, beneath the main hemispheres. It is best known for coordinating movement and balance, using signals from the inner ear and the body, but it also contributes to timing, attention and other mental functions."
  wiki: Cerebellum
- term: cessation
  title: Cessation
  name: "Cessation (Nirodha)"
  def: "In Buddhist meditation, a cessation (Pali nirodha) is a complete gap in experience reported by some very advanced meditators: for a moment, consciousness itself seems to switch off and then return, with almost no sense of time having passed, often followed by a feeling of unusual clarity. Theravada teachings link brief cessations to the last of the stages of insight, called fruition, and also describe a longer attainment, nirodha samāpatti. Science has studied cessations in only a handful of meditators."
  wiki: Nirodha-samāpatti
- term: near_death_experience
  title: Near-Death Experience
  def: "A near-death experience (NDE) is a pattern of vivid experiences that some people report after coming close to death, for example during a cardiac arrest, or believing they were. Common features include a sense of leaving the body, moving through a tunnel, meeting a being of light or people who have died, reviewing one's life and losing the sense of time and space. Researchers usually identify NDEs with questionnaires such as Greyson's Near-Death Experience Scale, and what causes them is still debated."
  wiki: Near-death_experience
- term: mystical_experience
  title: Mystical Experience
  def: "A mystical experience is an experience, often described as religious or spiritual, of unity with everything, loss of the usual sense of self, timelessness, deep positive feeling and a sense of having glimpsed a deeper truth, which is typically felt to be hard to put into words. Researchers measure it with questionnaires such as Hood's Mysticism Scale. Such experiences are reported in meditation and prayer, and after taking psychedelic drugs."
  wiki: Mystical_or_religious_experience
- term: non_attachment
  title: Non-Attachment
  def: "In Buddhist psychology, non-attachment is freedom from clinging: being able to engage with experiences, people and things without needing to hold on to them, and to let them go when they change or end. It is not the same as indifference or emotional detachment. Researchers measure it with questionnaires such as the Non-Attachment Scale, on which higher scores mean less clinging."
  wiki: Nonattachment_(philosophy)
- term: nimitta
  title: Nimitta
  def: "In Theravada Buddhist meditation, a nimitta (Pali for \"sign\") is a mental image that is said to appear once concentration has developed, often while focusing on the breath. It is commonly described as a light, such as a star, a cluster of gems or the disk of the moon. Teachers treat it as a sign of deepening concentration, and it can become the new object of attention on the way to the jhanas."
  wiki: Nimitta
- term: sensory_deprivation
  title: Sensory Deprivation
  def: "Sensory deprivation is the deliberate reduction of input to the senses, for example by sitting in a dark, silent room, wearing blindfolds and earplugs, or floating in a lightless tank. Even short periods can change perception, including simple visual hallucinations such as spots or flashes of light."
  wiki: Sensory_deprivation
- term: perceptual_isolation
  title: Perceptual Isolation
  name: "Perceptual Isolation (Ganzfeld)"
  def: "Perceptual isolation, studied as the Ganzfeld effect, means exposing someone to an unchanging, featureless field of sight or sound, such as an even wash of light over both eyes with steady white noise. The senses still receive input, but the brain habituates and filters it out, and people often begin to see lights, patterns or images that aren't there."
  wiki: Ganzfeld_effect
- term: charles_bonnet_syndrome
  title: Charles Bonnet Syndrome
  def: "Charles Bonnet syndrome is a condition in which people with poor vision or blindness, most often older adults, see things that aren't there, from spots, flashes and patterns to faces or scenes. It is not a sign of mental illness, and people usually know the images aren't real. It is thought to arise when visual areas of the brain, deprived of input, become overactive."
  wiki: Visual_release_hallucinations
- term: homeostatic_plasticity
  title: Homeostatic Plasticity
  def: "Homeostatic plasticity is a set of feedback mechanisms that keep neurons' activity near a stable level. If a neuron receives less input, it becomes more excitable, for example by strengthening its connections; if it receives too much, it becomes less excitable. When sensory input drops sharply, this compensation can overshoot and cause spontaneous firing."
  wiki: Homeostatic_plasticity
- term: occipital_lobe
  title: Occipital Lobe
  def: "The occipital lobe, at the back of the brain, is the brain's main center for vision. Its outer layer, the occipital or visual cortex, receives signals from the eyes and analyzes features such as edges, color and movement."
  wiki: Occipital_lobe
- term: hypnagogia
  title: Hypnagogia
  def: "Hypnagogia is the drowsy state between wakefulness and sleep. Experiences that arise in it, called hypnagogic hallucinations, are very common: dream-like images, sounds, or a sudden feeling of falling as a person drifts off. They are usually harmless."
  wiki: Hypnagogia
- term: factor_analysis
  title: Factor Analysis
  def: "Factor analysis is a statistical method for finding a smaller number of underlying dimensions, called factors, behind answers to many questions. Questions that people tend to answer in similar ways are grouped onto the same factor. Researchers choose how many factors to keep and name them by the questions that load on each, so the result involves judgment as well as arithmetic."
  wiki: Factor_analysis
- term: cronbachs_alpha
  title: Cronbach's Alpha
  def: "Cronbach's alpha is a measure of how consistently a set of questionnaire items measures the same thing, based on how strongly people's answers to them go together. It runs from 0 to 1; values of about 0.7 or higher are usually considered acceptable for research."
  wiki: Cronbach%27s_alpha
- term: zen
  title: Zen
  def: "Zen is a school of Mahayana Buddhism that developed in China (as Chan) and spread to Japan, Korea and Vietnam. Its central practice is seated meditation (zazen), such as shikantaza, \"just sitting\" in open awareness without a particular object, or working with koans, paradoxical questions meant to cut through ordinary conceptual thinking."
  wiki: Zen
- term: craving
  title: Craving
  def: "Craving is an intense, often hard-to-resist desire for a substance or activity, such as a cigarette, a drink or a drug. It is a core feature of addiction: cues linked to past use, such as places, moods or the sight of a lighter, can trigger it, and strong cravings make relapse more likely. Mindfulness-based treatments teach people to notice cravings as passing sensations and ride them out rather than act on them."
  wiki: Craving_(withdrawal)
- term: nicotine_replacement_therapy
  title: Nicotine Replacement Therapy
  def: "Nicotine replacement therapy (NRT) gives smokers nicotine without tobacco smoke, through patches, gum, lozenges, inhalers or sprays, to ease withdrawal and cravings while they quit. It is one of the standard medications for stopping smoking, often combined with counseling."
  wiki: Nicotine_replacement_therapy
- term: correlation
  title: Correlation
  name: "Correlation (Pearson's r)"
  def: "A correlation measures how closely two things rise and fall together across people or over time. Pearson's r runs from −1 to +1: values near +1 mean that people high on one measure tend to be high on the other, values near −1 mean the reverse, and values near 0 mean no straight-line relationship. A correlation alone can't show that one thing causes the other."
  wiki: Pearson_correlation_coefficient
- term: moderation_analysis
  title: Moderation Analysis
  def: "Moderation analysis is a statistical method that tests whether the link between two variables changes depending on a third, called the moderator. For example, it can ask whether the link between craving and smoking is weaker in people who practice mindfulness more often. It is usually tested by adding an interaction term (the product of the two predictors) to a regression. It shows that a relationship differs between people, not why."
  wiki: Moderation_(statistics)
- term: negative_reinforcement
  title: Negative Reinforcement
  def: "Negative reinforcement is learning in which a behavior becomes more likely because it removes or relieves something unpleasant. Smoking to ease withdrawal, stress or a bad mood is a common example: the relief teaches the brain to reach for a cigarette the next time that feeling appears. It is the counterpart of positive reinforcement, where a behavior is strengthened by a pleasant result."
  wiki: Negative_reinforcement
- term: more
  title: MORE
  name: "Mindfulness-Oriented Recovery Enhancement (MORE)"
  def: "Mindfulness-Oriented Recovery Enhancement (MORE) is an 8-week group program developed by the social work researcher Eric Garland for addiction, stress and chronic pain, including opioid misuse. It combines mindfulness meditation with reappraisal (reframing unhelpful thoughts, a technique from cognitive behavioral therapy) and savoring (deliberately dwelling on pleasant experiences). Its aim is to shift the brain's reward system from valuing drugs back toward valuing natural rewards."
  wiki: Mindfulness-Oriented_Recovery_Enhancement
- term: opioid_use_disorder
  title: Opioid Use Disorder
  def: "Opioid use disorder is the medical term for opioid addiction: a pattern of opioid use, whether of prescribed painkillers, heroin or other opioids, that a person struggles to control and that causes significant harm or distress. Signs include strong cravings, needing more to get the same effect, and continuing to use despite problems at home, work or with health. It is usually treated with medications such as buprenorphine or methadone, often alongside counseling."
  wiki: Opioid_use_disorder
- term: mbrp
  title: MBRP
  name: "Mindfulness-Based Relapse Prevention (MBRP)"
  def: "Mindfulness-Based Relapse Prevention (MBRP) is an 8-week group program for people recovering from alcohol or drug problems, developed by Sarah Bowen, G. Alan Marlatt and colleagues. Modeled on mindfulness-based cognitive therapy, it combines mindfulness meditation with cognitive-behavioral relapse prevention skills such as spotting high-risk situations. Participants practice noticing cravings and difficult emotions as passing experiences rather than automatically acting on them."
- term: moderation
  title: Moderation
  name: "Moderation (Statistics)"
  def: "Moderation is when the strength of a link between two things depends on a third factor, called the moderator. For example, low mood might strongly predict craving in one treatment group but hardly at all in another; treatment group then moderates the link between mood and craving. Researchers test it with an interaction term in a regression. Combined with mediation analysis, it is called moderated mediation."
  wiki: Moderation_(statistics)
- term: operant_conditioning
  title: Operant Conditioning
  def: "Operant conditioning is learning from the consequences of behavior. An action followed by something pleasant (positive reinforcement) or by relief from something unpleasant (negative reinforcement) becomes more likely to be repeated, so that over time a cue such as a sight, a place or a mood can set off the habit almost automatically."
  wiki: Operant_conditioning
- term: bmi
  title: BMI
  name: "Body Mass Index (BMI)"
  def: "Body mass index (BMI) is a person's weight in kilograms divided by the square of their height in meters. Adults with a BMI of 25 to 29.9 are classed as overweight and 30 or more as obese. It is a quick screening measure that does not distinguish fat from muscle."
  wiki: Body_mass_index
- term: attentional_bias
  title: Attentional Bias
  def: "An attentional bias is a tendency for attention to be drawn to certain kinds of things more than others. In addiction research it usually means that images or words linked to a drug, such as a cigarette or a pill bottle, grab a user's attention faster or hold it longer than neutral ones. It is measured with computer tasks that time how quickly people respond to drug-related and neutral cues."
  wiki: Attentional_bias
- term: cue_reactivity
  title: Cue Reactivity
  def: "Cue reactivity is the set of reactions that reminders of a drug, such as the sight of a cigarette, a bottle or a syringe, set off in someone who uses it: craving, bodily changes such as in heart rate and sweating, and activity in the brain's reward circuits. Researchers measure it by showing such cues in the lab; stronger reactions have been linked to a higher risk of relapse."
  wiki: Cue_reactivity
- term: striatum
  title: Striatum
  def: "The striatum is a group of structures deep in the brain that is central to reward, motivation and habit. Its lower part, the ventral striatum (which includes the nucleus accumbens), responds to pleasures and to cues that predict them, and is strongly activated by addictive drugs. Its upper part, the dorsal striatum, is involved in movement and in habits that run automatically."
  wiki: Striatum
- term: relapse_prevention
  title: Relapse Prevention
  def: "Relapse prevention is a cognitive-behavioral approach to addiction treatment, developed by G. Alan Marlatt and colleagues, that helps people stay off alcohol or drugs after they have stopped. Patients learn to identify high-risk situations, such as stress or certain places and people, to plan and practice ways of coping with them, and to treat a slip as something to learn from rather than a complete failure."
  wiki: Relapse_prevention
- term: twelve_step
  title: Twelve-Step Program
  def: "A twelve-step program is a mutual-help approach to recovery from addiction based on the twelve steps of Alcoholics Anonymous, such as admitting powerlessness over the addiction, taking a moral inventory and making amends. Members meet in peer-led groups, aim for complete abstinence and are encouraged to find a sponsor. Many addiction treatment centers build their programs around these principles."
  wiki: Twelve-step_program
- term: substance_use_disorder
  title: Substance Use Disorder
  def: "A substance use disorder is the clinical term for addiction to alcohol or other drugs: continued use despite harm, with problems such as craving, loss of control over how much is used, and failed attempts to cut down. It ranges from mild to severe, and relapse after treatment is common."
  wiki: Substance_use_disorder
- term: orbitofrontal_cortex
  title: Orbitofrontal Cortex
  def: "The orbitofrontal cortex (OFC) is the part of the frontal lobes just above the eye sockets. It helps judge how rewarding or unpleasant something is in its context, updates those judgments as circumstances change, and is involved in regulating emotions."
  wiki: Orbitofrontal_cortex
- term: arterial_spin_labeling
  title: Arterial Spin Labeling
  def: "Arterial spin labeling (ASL) is a kind of MRI scan that measures blood flow in the brain by magnetically tagging the water in blood flowing up the neck and imaging it as it arrives. It needs no injected tracer, and unlike standard fMRI it gives blood flow in absolute units, which makes it suited to comparing slow, steady states that last for minutes."
  wiki: Arterial_spin_labelling
- term: chronic_pain
  title: Chronic Pain
  def: "Chronic pain is pain that lasts longer than about three months, or beyond the time tissues normally take to heal. It can follow an injury or illness, accompany conditions such as arthritis or fibromyalgia, or have no clear cause. Because the nervous system can become more sensitive over time, chronic pain often persists even when the original damage has healed, and it is frequently accompanied by depression, poor sleep and reliance on pain medication."
  wiki: Chronic_pain
- term: fibromyalgia
  title: Fibromyalgia
  def: "Fibromyalgia is a long-term condition marked by widespread pain across the body, along with fatigue, poor sleep and problems with memory and concentration. Its cause is not fully understood; it is thought to involve heightened sensitivity to pain in the central nervous system rather than damage to muscles or joints. It is diagnosed more often in women, and treatment usually combines exercise, psychological therapies and medication."
  wiki: Fibromyalgia
- term: focused_attention
  title: Focused Attention
  name: "Focused Attention Meditation"
  def: "Focused attention is a style of meditation in which you keep your attention on one chosen object, such as the breath or a point in front of you, notice when the mind has wandered, and bring it back. It trains steady concentration, and Buddhist shamatha practice is a well-known example. Researchers often contrast it with open monitoring meditation."
- term: open_monitoring
  title: Open Monitoring
  name: "Open Monitoring Meditation"
  def: "Open monitoring is a style of meditation in which attention isn't fixed on any one object. You stay aware of whatever arises from moment to moment, such as sounds, sensations and thoughts, and let each come and go without reacting to it, holding on to it or pushing it away. Researchers often contrast it with focused attention meditation."
- term: pain_catastrophizing
  title: Pain Catastrophizing
  def: "Pain catastrophizing is a tendency to magnify the threat of pain, dwell on it and feel helpless in the face of it, for example by thinking that it will never stop or that something terrible is wrong. People who catastrophize tend to report more severe pain and more distress and disability from it."
  wiki: Pain_catastrophizing
- term: relative_risk
  title: Relative Risk
  def: "A relative risk (or risk ratio) is the chance of an outcome in one group divided by the chance in another. A relative risk of 1 means no difference; 1.5 means the outcome was 50% more common in the first group. If 60% of one group improve and 40% of another, the relative risk is 1.5. Unlike an odds ratio, it can be read directly as how many times more likely something is."
  wiki: Relative_risk
- term: low_back_pain
  title: Low Back Pain
  def: "Low back pain is pain between the bottom of the ribs and the buttocks, and a leading cause of disability worldwide. Most cases are called non-specific because no particular cause, such as a fracture, infection or nerve compression, can be found. Pain lasting more than three months is called chronic."
  wiki: Low_back_pain
- term: somatosensory_cortex
  title: Somatosensory Cortex
  def: "The somatosensory cortex is the part of the brain's surface that receives touch, temperature, pain and body-position signals. The primary somatosensory cortex (S1), a strip behind the central groove at the top of the brain, holds a map of the body, with each body part in its own spot; the secondary somatosensory cortex (S2), lower down on each side, helps tell what a sensation is and how strong it feels."
  wiki: Somatosensory_cortex
- term: psychophysiological_interaction
  title: PPI
  name: "Psychophysiological Interaction (PPI)"
  def: "A psychophysiological interaction (PPI) analysis measures, with fMRI, whether two brain regions work together more or less closely in one condition than another, for example during painful heat compared with harmless warmth. It asks whether a chosen region's activity tracks another region's activity differently depending on the task, a kind of task-dependent functional connectivity. Like other connectivity measures, it shows coordinated activity, not a physical connection or which region drives the other."
  wiki: Psychophysiological_interaction
- term: minimal_clinically_important_difference
  title: Minimal Clinically Important Difference
  def: "The minimal clinically important difference is the smallest change in a score that patients would notice and consider worthwhile. It is set separately for each questionnaire or scale, often by asking patients whether they feel better and seeing how much their scores changed. A result can be statistically significant yet smaller than this threshold, which means it may be real but too small to matter much in daily life."
  wiki: Minimal_important_difference
- term: self_efficacy
  title: Self-Efficacy
  def: "Self-efficacy is a person's confidence in their ability to do what a situation calls for, a concept developed by the psychologist Albert Bandura. In pain research it usually means confidence in being able to manage pain and keep up daily activities despite it. People with chronic pain who have higher self-efficacy tend to be less disabled and less distressed by their pain."
  wiki: Self-efficacy
- term: terror_management_theory
  title: Terror Management Theory
  def: "Terror management theory is a social psychology theory, proposed in 1986, that people's awareness that they will die could cause paralyzing dread, which they manage by holding on to shared cultural beliefs that make the world feel orderly and meaningful and by building self-esteem through living up to those beliefs. Its best-known prediction, tested in many experiments, is that reminders of death make people cling more tightly to their worldview and defend it against others."
  wiki: Terror_management_theory
- term: ffmq
  title: FFMQ
  name: "Five Facet Mindfulness Questionnaire (FFMQ)"
  def: "The Five Facet Mindfulness Questionnaire (FFMQ) is a widely used 39-item self-report questionnaire that measures mindfulness as an everyday tendency. It gives scores for five facets: observing experiences, describing them in words, acting with awareness rather than on autopilot, not judging one's inner experience, and not reacting to it. Because it relies on self-report, scores can reflect how people see themselves, and can shift with what they have learned about mindfulness."
  wiki: Five_Facet_Mindfulness_Questionnaire
- term: maranasati
  title: Maranasati
  name: "Maranasati (Mindfulness of Death)"
  def: "Maranasati (Pali maraṇasati, \"mindfulness of death\" or recollection of death) is a Buddhist meditation in which practitioners deliberately bring to mind that they will die and that death could come at any time. Early Buddhist texts describe it both as a reflection, at its most urgent the thought that death could come with the next breath, and as contemplating a corpse in stages of decay as a reminder that one's own body will share that fate. It is traditionally meant to counter complacency and to loosen fear of and clinging to life."
  wiki: Maranasati
- term: livor_mortis
  title: Livor Mortis
  def: "Livor mortis (also called lividity) is the purplish discoloration that appears on the lowest parts of a body after death, as the blood stops circulating and settles under gravity. It usually becomes visible within half an hour to two hours and reaches its full color within about 8 to 12 hours, so forensic pathologists use it, along with rigor mortis and other changes, to estimate how long ago someone died."
  wiki: Livor_mortis
- term: guhyasamaja
  title: Guhyasamāja
  name: "Guhyasamāja Tantra"
  def: "The Guhyasamāja Tantra (Sanskrit for \"secret assembly\"), called the King of Tantras, is a central text and practice cycle of tantric Buddhism, especially important in the Geluk school of Tibetan Buddhism. Practitioners visualize themselves as a deity within a mandala of deities, work with a visualized subtle anatomy of channels and energies, and finally dissolve the whole visualization into emptiness, a sequence the tradition sees as a rehearsal for death."
  wiki: Guhyasamāja_Tantra
- term: ringsel
  title: Ringsel
  def: "Ringsel (Tibetan ring bsrel) are small, pearl-like beads that Tibetan Buddhists say are sometimes found among the cremated remains of accomplished practitioners. They are venerated and enshrined as relics, and the tradition treats them as a sign of the person's spiritual attainment."
  wiki: Ringsel
- term: predictive_coding
  title: Predictive Coding
  def: "Predictive coding (or predictive processing) is the theory that the brain constantly predicts what it is about to sense and compares those predictions with what actually arrives. Mismatches, called prediction errors, are passed on to update its model of the world and of the self. A surprise response to an unexpected stimulus is therefore taken as a sign that the brain had formed a prediction in the first place."
  wiki: Predictive_coding
- term: anatta
  title: Anattā
  name: "Anattā (No-Self)"
  def: "Anattā, usually translated as \"no-self\" or \"non-self\", is the Buddhist teaching that there is no permanent, unchanging self or soul. What we take to be a self is, on this view, a changing stream of bodily sensations, feelings, perceptions, thoughts and awareness. Buddhist traditions hold that clinging to the sense of a lasting self is a root of suffering, and that seeing through it brings freedom from that suffering."
  wiki: Anattā
- term: episodic_memory
  title: Episodic Memory
  def: "Episodic memory is memory for particular events you lived through, such as your last birthday, recalled with a sense of when and where they happened and of re-experiencing them. It differs from semantic memory, which stores general facts. Episodic memory is closely tied to imagining one's own future, and both are thought to help give people a sense of being the same person over time."
  wiki: Episodic_memory
- term: mortality_salience
  title: Mortality Salience
  def: "Mortality salience is the state of being reminded of one's own death. In terror management research it is created on purpose, usually by asking people to write briefly about their own death, and compared with a control group asked about an unpleasant but non-lethal topic such as dental pain. Researchers then measure how the reminder shifts people's judgments, typically after a short delay that lets thoughts of death fade from awareness."
  wiki: Mortality_salience
- term: thought_suppression
  title: Thought Suppression
  def: "Thought suppression is the deliberate attempt to push an unwanted thought out of mind. It often backfires: suppressed thoughts tend to come back more strongly later, a rebound effect. Terror management research holds that thoughts of death are pushed away right after a reminder of death and become more accessible after a delay, which experiments measure with word fragments that can be completed as either death-related or neutral words."
  wiki: Thought_suppression
- term: death_thought_accessibility
  title: Death-Thought Accessibility
  def: "Death-thought accessibility is how readily thoughts of death come to mind. It is usually measured with word fragments that can be completed either as a death-related word or as a neutral one, such as SK_ _L (skull or skill), and counting the death-related completions. In terror management theory research, the count is normally compared between people given a death reminder and people given a neutral one."
- term: affective_misattribution_procedure
  title: Affective Misattribution Procedure
  def: "The affective misattribution procedure (AMP) is a test of implicit attitudes. A word or picture flashes briefly on screen, followed by an unfamiliar symbol such as a Chinese character, and people judge whether the symbol is more or less pleasant than average. Feelings about the first item tend to spill over onto the symbol even when people are told to ignore it, so the share of \"pleasant\" judgments after each kind of item is read as an attitude they might not report directly."
- term: sufism
  title: Sufism
  def: "Sufism is the mystical tradition within Islam. Its practitioners, often organized in orders around a teacher, seek a direct inner experience of God through practices such as dhikr (rhythmic repetition of God's names or short phrases), meditation, prayer and, in some orders, music and movement. Sufi writers often describe death not as an end to be feared but as a reunion with God."
  wiki: Sufism
- term: sgacc
  title: sgACC
  name: "Subgenual Anterior Cingulate Cortex (sgACC)"
  def: "The subgenual anterior cingulate cortex (sgACC) is the lowest part of the anterior cingulate cortex, lying beneath the bend (genu) at the front of the corpus callosum, next to the ventromedial prefrontal cortex. It is involved in emotion and mood: it is overactive in depression, where it has been a target of deep brain stimulation. Brain-imaging studies have also found it more active when smokers see cigarette cues and crave."
  wiki: Brodmann_area_25
- term: resting_state_fmri
  title: Resting-State fMRI
  def: "Resting-state fMRI scans the brain while a person lies quietly and does nothing in particular, often looking at a crosshair. Instead of measuring responses to a task, it looks at the slow, spontaneous fluctuations in each area's activity signal: how strongly an area fluctuates (one measure is the fractional amplitude of low-frequency fluctuations, or fALFF) or how closely areas fluctuate together. Differences are read as changes in the brain's baseline activity, though what they mean for thought or behavior is often uncertain."
  wiki: Resting_state_fMRI
- term: ftnd
  title: FTND
  name: "Fagerström Test for Nicotine Dependence (FTND)"
  def: "The Fagerström Test for Nicotine Dependence (FTND) is a short, widely used questionnaire that rates how dependent a person is on nicotine. Its six questions ask, for example, how soon after waking the person has their first cigarette, whether they find it hard not to smoke where smoking is forbidden, and how many cigarettes they smoke a day. Scores run from 0 to 10, with higher scores meaning stronger dependence."
  wiki: Fagerström_Test_for_Nicotine_Dependence
- term: sense_of_ownership
  title: Sense of Ownership
  def: "The sense of ownership is the feeling that your body and your experiences are your own: that this is my hand and these are my sensations. Researchers distinguish it from the sense of agency, the feeling of being the one who acts: if someone else moves your arm, it still feels like yours, but you don't feel you moved it. Illusions such as the rubber hand illusion show that it can be shifted in the lab."
  wiki: Sense_of_ownership
- term: proprioception
  title: Proprioception
  def: "Proprioception is the body's sense of its own position and movement: knowing where your limbs are, and how they are moving, without looking. It relies on sensors in the muscles, tendons and joints. The closely related sense of movement is called kinesthesia."
  wiki: Proprioception
- term: grounded_theory
  title: Grounded Theory
  def: "Grounded theory is a qualitative research method in which researchers build categories and explanations from the material itself, such as interview transcripts, rather than testing hypotheses fixed in advance. They read and code the material repeatedly, comparing passages and refining the categories until a coherent picture emerges. It was developed by the sociologists Barney Glaser and Anselm Strauss in the 1960s."
  wiki: Grounded_theory
- term: placebo
  title: Placebo
  def: "A placebo is an inactive treatment, such as a sugar pill or a cream with no drug in it, made to look like a real one. The placebo effect is the improvement people feel after receiving it, driven by their expectations, by learning from past experiences of real treatment, and by the setting of care. Pain is especially responsive: placebo pain relief is well documented in the lab and has been linked to prefrontal brain areas and the brain's own opioids."
  wiki: Placebo
- term: periaqueductal_gray
  title: PAG
  name: "Periaqueductal Gray (PAG)"
  def: "The periaqueductal gray (PAG) is a small column of gray matter in the midbrain, surrounding the narrow canal that carries cerebrospinal fluid through the brainstem. It is a key part of the body's built-in pain control system: signals from the PAG travel down to the spinal cord and can dampen incoming pain signals, partly through the brain's own opioids. It is also involved in defensive responses to threat."
  wiki: Periaqueductal_gray
- term: relaxation_response
  title: Relaxation Response
  def: "The relaxation response is a term coined by the cardiologist Herbert Benson in the 1970s for a state of physical rest, the opposite of the stress response, that can be brought on by sitting quietly, breathing slowly and repeating a word or phrase. It is marked by slower breathing and heart rate and lower oxygen use. Researchers sometimes ask whether meditation's benefits come from this general calming rather than from anything specific to the practice."
  wiki: Relaxation_response
- term: parahippocampal_gyrus
  title: Parahippocampal Gyrus
  def: "The parahippocampal gyrus is a fold of cortex on the inner, lower surface of each temporal lobe, running alongside the hippocampus. It helps form memories, especially of places and scenes. Together with nearby areas such as the cingulate cortex and insula, it is counted as part of the paralimbic system, which links the brain's emotion-related limbic structures, such as the amygdala, with the outer cortex."
  wiki: Parahippocampal_gyrus
- term: brain_atrophy
  title: Brain Atrophy
  def: "Brain atrophy is the loss of brain tissue, seen on MRI as smaller volumes of gray or white matter. Some shrinkage is a normal part of aging: overall brain volume starts to fall from early adulthood and the decline continues through later life. Faster or more extensive atrophy is linked to cognitive decline and to diseases such as Alzheimer's."
  wiki: Cerebral_atrophy
- term: independent_component_analysis
  title: ICA
  name: "Independent Component Analysis (ICA)"
  def: "Independent component analysis (ICA) is a statistical method that splits a mix of recorded signals into separate underlying sources, much as one might pick out single voices in a crowded room. In EEG research it is used to find and remove activity that doesn't come from the brain, such as eye blinks, eye movements and muscle tension, which would otherwise contaminate the brain-wave recordings."
  wiki: Independent_component_analysis
- term: lexical_decision_task
  title: Lexical Decision Task
  def: "A lexical decision task is a standard psychology test in which a person sees a string of letters and decides, usually by pressing a button, whether it is a real word or a made-up one that could be pronounced but means nothing. Researchers use it to study how words and their meanings are recognized: comparing the responses to real words and to nonwords isolates what the meaning adds."
  wiki: Lexical_decision_task
- term: hemodynamic_response
  title: Hemodynamic Response
  def: "The hemodynamic response is the change in blood flow and oxygen in a brain area after its neurons become active, and it is what fMRI actually measures (as the BOLD, or blood-oxygen-level-dependent, signal). It is slow: after a brief event the signal rises over a few seconds, peaks and takes several more seconds to settle. Researchers often model it with a standard curve, which can miss responses that last longer than usual."
  wiki: Haemodynamic_response
- term: inferior_temporal_gyrus
  title: Inferior Temporal Gyrus
  def: "The inferior temporal gyrus is the lowest of the ridges (gyri) along the outer side of each temporal lobe, the part of the brain behind the temples. It is part of the brain's visual pathway for recognizing objects, faces and other complex shapes."
  wiki: Inferior_temporal_gyrus
- term: mantra
  title: Mantra
  def: "A mantra is a sound, word or phrase that is repeated, aloud or silently, as a spiritual or meditative practice. Mantras are central to Hindu and Buddhist traditions and appear in many others. In mantra meditation, the repetition itself serves as the object of attention, and practitioners often describe it as calming."
  wiki: Mantra
- term: bold_signal
  title: BOLD Signal
  name: "Blood-Oxygen-Level-Dependent (BOLD) Signal"
  def: "The BOLD (blood-oxygen-level-dependent) signal is what fMRI actually measures. When a brain area becomes more active, blood flow to it rises more than its oxygen use does, changing the ratio of oxygen-rich to oxygen-poor blood, which the scanner can detect. A BOLD increase is read as more activity in an area, and a decrease (a negative BOLD response or deactivation) as less, always relative to a comparison condition such as rest."
  wiki: Blood-oxygen-level-dependent_imaging
- term: verbal_fluency_test
  title: Verbal Fluency Task
  def: "A verbal fluency task asks people to produce as many words as they can that fit a rule, such as words beginning with a given letter (letter fluency) or words in a category like animals (category fluency). It draws on language, memory search and executive control, and is widely used in neuropsychology and brain imaging."
  wiki: Verbal_fluency_test
- term: brocas_area
  title: Broca's Area
  def: "Broca's area is a region of the left frontal lobe, in the inferior frontal gyrus, long linked to producing speech. It is involved in planning and articulating words, in grammar, and in inner speech, and is typically active when people generate words, aloud or silently."
  wiki: Broca%27s_area
- term: gate_control_theory
  title: Gate Control Theory
  def: "The gate control theory of pain, proposed by Ronald Melzack and Patrick Wall in 1965, holds that nerve circuits in the spinal cord act as a gate that can let pain signals through to the brain or hold them back. Input from touch fibers can partly close the gate, which is why rubbing a bumped elbow eases the pain. The idea of a gate that blocks competing signals has since been borrowed to explain other effects in the brain."
  wiki: Gate_control_theory
- term: social_anxiety_disorder
  title: Social Anxiety Disorder
  def: "Social anxiety disorder (SAD), also called social phobia, is an anxiety disorder marked by an intense, lasting fear of being watched, judged or embarrassed in social or performance situations. People with it often avoid such situations or endure them with great distress, and tend to focus on critical thoughts about themselves and on signs of others' disapproval. It is one of the most common anxiety disorders and is usually treated with cognitive-behavioral therapy or medication."
  wiki: Social_anxiety_disorder
- term: emotion_regulation
  title: Emotion Regulation
  def: "Emotion regulation is the set of ways people influence which emotions they have, when they have them, and how they experience and express them. Psychologist James Gross's process model groups the strategies into five families: choosing situations, changing situations, shifting attention (attentional deployment), changing how one thinks about a situation (reappraisal), and changing one's response, such as suppressing an expression."
  wiki: Emotional_self-regulation
- term: cluster_randomized_trial
  title: Cluster Randomized Trial
  def: "A cluster randomized trial randomly assigns whole groups, such as schools, classes, clinics or villages, rather than individual people, to receive a program or to serve as the comparison. It suits programs delivered to a group at once, and it keeps people in the comparison group from picking up the program from those who get it. Because people in the same group tend to resemble each other, these trials need more participants than ordinary ones, and the analysis has to account for the grouping."
  wiki: Cluster_randomised_controlled_trial
- term: social_emotional_learning
  title: Social-Emotional Learning (SEL)
  def: "Social-emotional learning (SEL) is teaching in schools that aims to build the skills young people need to manage their emotions, get on with others, make responsible decisions and look after their mental and physical health. It is usually offered to every student as part of the regular curriculum, covering topics such as relationships and health education, rather than only to those with problems."
  wiki: Social-emotional_learning
- term: hpa_axis
  title: HPA Axis
  name: "Hypothalamic–Pituitary–Adrenal (HPA) Axis"
  def: "The hypothalamic–pituitary–adrenal (HPA) axis is the body's main hormonal stress system. When the brain registers a threat, the hypothalamus signals the pituitary gland, which in turn signals the adrenal glands above the kidneys to release cortisol. Cortisol then feeds back to the brain to switch the response off. Because cortisol is its end product, researchers often measure cortisol in saliva to gauge how strongly the HPA axis reacts to a stressful task."
  wiki: Hypothalamic–pituitary–adrenal_axis
- term: salivary_alpha_amylase
  title: Alpha-Amylase
  name: "Salivary Alpha-Amylase"
  def: "Alpha-amylase is an enzyme in saliva that starts the digestion of starch. Its release rises quickly under stress, driven by the sympathetic (\"fight or flight\") nervous system, so stress researchers measure it in saliva samples as a marker of sympathetic activity, alongside cortisol as a marker of the hormonal stress response."
  wiki: Alpha-amylase
- term: c_reactive_protein
  title: CRP
  name: "C-Reactive Protein (CRP)"
  def: "C-reactive protein (CRP) is a protein made by the liver that rises in the blood during inflammation. A high-sensitivity test (hsCRP) can detect the low levels found in healthy people, and modestly raised levels are linked to a higher risk of heart disease. Researchers use it as a general marker of inflammation in the body."
  wiki: C-reactive_protein
- term: social_desirability_bias
  title: Social Desirability Bias
  def: "Social desirability bias is the tendency of people answering questionnaires or interviews to present themselves in a favorable light, for example by reporting more of what they think is good and less of what they think is bad. In meditation studies it can make people who have committed to a training report more benefit than they actually experienced, which is one reason researchers look for measures that don't rely on self-report."
  wiki: Social-desirability_bias
- term: hamilton_anxiety_scale
  title: HAM-A
  name: "Hamilton Anxiety Rating Scale (HAM-A)"
  def: "The Hamilton Anxiety Rating Scale (HAM-A) is a 14-item scale that a clinician scores after interviewing a patient, rating the severity of symptoms such as worry, tension, fears, poor sleep and trouble concentrating, along with physical complaints like a racing heart, muscle aches or an upset stomach. Each item runs from 0 to 4, for a total of 0 to 56. It is one of the most widely used outcome measures in trials of treatments for anxiety, and many of its items concern bodily symptoms."
  wiki: Hamilton_Anxiety_Rating_Scale
- term: clinical_global_impression
  title: CGI
  name: "Clinical Global Impression (CGI)"
  def: "The Clinical Global Impression (CGI) scales are brief ratings in which a clinician sums up a patient's overall condition. The severity scale (CGI-S) rates how ill the person is now, from 1 (normal) to 7 (among the most extremely ill); the improvement scale (CGI-I) rates how much they have changed since treatment began, from 1 (very much improved) to 7 (very much worse). Trials often count a CGI-I of 1 or 2 as a response to treatment."
  wiki: Clinical_Global_Impression
- term: beck_anxiety_inventory
  title: BAI
  name: "Beck Anxiety Inventory (BAI)"
  def: "The Beck Anxiety Inventory (BAI) is a 21-item questionnaire on which people rate how much they have been bothered by common symptoms of anxiety over the past week, such as nervousness, fear of the worst happening, a pounding heart or feeling unsteady. Each item is scored from 0 to 3, for a total of 0 to 63. Many of its items describe the bodily side of anxiety."
  wiki: Beck_Anxiety_Inventory
- term: panas
  title: PANAS
  name: "Positive and Negative Affect Schedule (PANAS)"
  def: "The Positive and Negative Affect Schedule (PANAS) is a widely used questionnaire with two short lists of feeling words, one for positive feelings and one for negative ones. People rate how strongly they feel each, and the ratings are added up into separate positive affect and negative affect scores, each from 10 to 50. The two scores are largely independent of each other, and when it asks about the present moment it can be given just before and just after a single session."
  wiki: Positive_and_Negative_Affect_Schedule
- term: respiratory_rate
  title: Respiratory Rate
  def: "Respiratory rate is the number of breaths a person takes per minute. At rest, adults typically breathe around 12 to 20 times a minute. Breathing tends to speed up with stress, effort and strong emotion and to slow down with relaxation and sleep, and slow, deliberate breathing is a common feature of meditation and breathing practices."
  wiki: Respiratory_rate
- term: mixed_model
  title: Mixed-Effects Model
  def: "A mixed-effects model is a statistical method for data in which the same people are measured many times, such as a daily rating over a month. It separates effects that apply to everyone, such as which group a person was in, from each person's own baseline and ups and downs, so that people who contributed more days don't count as extra independent evidence and people who skipped days can still be included."
  wiki: Mixed_model
- term: prehypertension
  title: Prehypertension
  def: "Prehypertension is blood pressure that is higher than ideal but below the level counted as high blood pressure (hypertension): a systolic reading of 120–139 mm Hg or a diastolic reading of 80–89 mm Hg, a category introduced by US guidelines in 2003. Systolic pressure is the peak pressure in the arteries as the heart beats, and diastolic the pressure between beats. At this level, guidelines recommend lifestyle changes such as exercise, weight loss and diet rather than medication."
  wiki: Prehypertension
- term: progressive_muscle_relaxation
  title: Progressive Muscle Relaxation
  def: "Progressive muscle relaxation (PMR) is a relaxation technique in which a person tenses and then releases groups of muscles in turn, noticing the contrast between tension and relaxation. With practice, fewer and larger muscle groups are used, until relaxation can be brought on by recall alone. It was developed by the physician Edmund Jacobson in the early 20th century and is often used as a comparison treatment in meditation trials."
  wiki: Progressive_muscle_relaxation
- term: ambulatory_blood_pressure
  title: Ambulatory Blood Pressure Monitoring
  def: "Ambulatory blood pressure monitoring measures blood pressure automatically at regular intervals, usually over 24 hours, with a cuff on the arm and a small recorder worn on the body while the person goes about their day and sleeps. Averaging dozens of readings, awake and asleep, gives a picture of everyday blood pressure that a few readings taken in a clinic can miss."
  wiki: Ambulatory_blood_pressure
- term: white_coat_hypertension
  title: White Coat Hypertension
  def: "White coat hypertension is blood pressure that is raised when measured in a clinic or by a health professional but normal in everyday life, likely because of the alertness or anxiety the setting brings. It is usually detected by comparing clinic readings with readings taken at home or with a 24-hour ambulatory monitor."
  wiki: White_coat_hypertension
- term: coronary_heart_disease
  title: Coronary Heart Disease
  def: "Coronary heart disease (also called coronary artery disease) is a narrowing of the arteries that supply the heart muscle with blood, usually by fatty plaques that build up in the artery walls. It can cause chest pain (angina) and heart attacks, and it is a leading cause of death worldwide. The narrowing is usually confirmed by angiography, an X-ray of the arteries taken after injecting a dye."
  wiki: Coronary_artery_disease
- term: fail_safe_n
  title: Fail-Safe N
  def: "The fail-safe N is an early check for publication bias in meta-analysis, proposed by the psychologist Robert Rosenthal. It estimates how many unpublished studies with an average effect of zero would have to exist to make a pooled result no longer statistically significant. A large number suggests the result can't be explained away by studies left in file drawers, though it doesn't show whether missing studies have inflated the size of the effect."
- term: funnel_plot
  title: Funnel Plot
  def: "A funnel plot is a scatter graph used in meta-analysis to look for publication bias. Each study's effect size is plotted against its precision, which depends mostly on its sample size. Without bias, small, imprecise studies scatter widely on both sides of the average and larger ones cluster near it, forming a symmetrical funnel. A gap on one side, typically where small studies with weak results would fall, suggests some studies are missing; the trim-and-fill method estimates how many and recalculates the average as if they had been included."
  wiki: Funnel_plot
- term: jadad_scale
  title: Jadad Scale
  def: "The Jadad scale is a short checklist, published by Alejandro Jadad and colleagues in 1996, for rating the quality of reports of clinical trials. It awards up to 5 points: for describing the study as randomized and randomizing properly, for describing it as double-blind and blinding properly, and for accounting for dropouts and withdrawals. Trials of therapies such as meditation, where participants know which treatment they receive, rarely earn the blinding points."
  wiki: Jadad_scale
- term: nf_kb
  title: NF-κB
  name: "Nuclear Factor Kappa B (NF-κB)"
  def: "NF-κB is a family of proteins that act as a master switch for inflammation inside cells. When a cell senses infection, injury or stress signals, NF-κB moves into the nucleus and turns on genes for inflammatory messengers such as IL-6 and TNF-α. Psychological stress has been linked to more NF-κB activity in immune cells, so researchers studying stress and meditation often look at the genes it controls."
  wiki: "NF-κB"
- term: gene_set_enrichment_analysis
  title: GSEA
  name: "Gene Set Enrichment Analysis (GSEA)"
  def: "Gene set enrichment analysis (GSEA) is a way of analyzing gene activity data in which, instead of testing thousands of genes one at a time, researchers test predefined sets of genes that work together, such as all the genes in one biological pathway. It asks whether the genes in a set tend to shift in the same direction between two conditions, so it can pick up small, coordinated changes that single-gene tests would miss. Results are usually judged with a false discovery rate."
  wiki: Gene_set_enrichment_analysis
- term: mitochondrion
  title: Mitochondria
  def: "Mitochondria are tiny structures inside most cells that turn nutrients and oxygen into ATP, the molecule cells use for energy. Their final steps, a chain of proteins called the electron transport chain that powers an enzyme called ATP synthase, also produce reactive oxygen species, by-products that can damage cells when they build up (oxidative stress)."
  wiki: Mitochondrion
- term: systematic_review
  title: Systematic Review
  def: "A systematic review gathers all the studies on a question using a search method and inclusion rules set out in advance, so that readers can see how the studies were found and why each was kept or left out. It may or may not go on to combine the results statistically; a review that does is also a meta-analysis, while one that doesn't describes and tallies the findings instead."
  wiki: Systematic_review
- term: cd4_t_cells
  title: CD4+ T Cells
  def: "CD4+ T cells, also called helper T cells, are white blood cells that coordinate the immune response by signaling to other immune cells. HIV infects and destroys them, so the number of CD4+ T cells in a sample of blood is a standard measure of how far HIV infection has progressed and how well the immune system is holding up."
  wiki: T_helper_cell
- term: monocyte
  title: Monocyte
  def: "Monocytes are white blood cells, made in the bone marrow, that circulate in the blood and can move into tissues, where they become macrophages that engulf microbes and debris. They are part of the innate immune system, the body's fast, first-line defense, and are a major source of the signaling proteins (cytokines) that drive inflammation."
  wiki: Monocyte
- term: set_and_setting
  title: Set and Setting
  def: "Set and setting are the two non-drug factors that shape how a psychedelic experience unfolds. \"Set\" is the person's mindset: their expectations, mood, personality and intentions. \"Setting\" is the physical and social environment: the place, the people present and the support on hand. The same dose can bring a blissful experience in one set and setting and an anxious, distressing one in another, which is why research studies prepare volunteers carefully and give the drug in calm, supervised surroundings."
  wiki: Set_and_setting
- term: openness_to_experience
  title: Openness to Experience
  def: "Openness to experience is one of the five broad personality traits in the widely used Big Five model. People high in openness tend to be imaginative, curious, attentive to their inner feelings, drawn to variety and new ideas, and sensitive to art and beauty. It is measured with personality questionnaires such as the NEO Five-Factor Inventory."
  wiki: Openness_to_experience
- term: divergent_thinking
  title: Divergent Thinking
  def: "Divergent thinking is the side of creativity that produces many different ideas for an open-ended problem with no single right answer, as in brainstorming. It is often measured with the Alternate Uses Task, in which people list as many uses as they can for an everyday object such as a brick; answers are scored for how many there are, how many different categories they span and how unusual they are. The psychologist J. P. Guilford contrasted it with convergent thinking."
  wiki: Divergent_thinking
- term: convergent_thinking
  title: Convergent Thinking
  def: "Convergent thinking is the side of creativity that homes in on the single best answer to a well-defined problem. It is often measured with the Remote Associates Test, in which people find one word that links three others (for example, \"long\" for time, hair and stretch). The psychologist J. P. Guilford contrasted it with divergent thinking, which generates many possible answers."
  wiki: Convergent_thinking
- term: within_subject_design
  title: Within-Subject Design
  def: "In a within-subject (or repeated-measures) design, every participant takes part in all of a study's conditions, and their results under one condition are compared with their own results under the others. Because each person serves as their own comparison, it needs fewer participants than comparing separate groups. But the order of conditions can matter, through practice, fatigue or carry-over, so researchers vary the order across participants, and people may guess what is being compared."
  wiki: Repeated_measures_design
- term: executive_function
  title: Executive Function
  def: "Executive functions are the mental skills used to control and direct thinking and behavior toward a goal. The three core ones are usually given as inhibitory control (holding back an automatic response or ignoring a distraction), working memory (keeping information in mind and using it) and cognitive flexibility (switching between rules, tasks or points of view). They develop rapidly in early childhood, rely heavily on the prefrontal cortex, and predict how well children do at school."
  wiki: Executive_functions
- term: delay_of_gratification
  title: Delay of Gratification
  def: "Delay of gratification is the ability to resist a smaller reward now in order to get a larger one later. It is often tested in young children by offering a choice, such as one treat now or two later, and counting how often they choose to wait. Walter Mischel's \"marshmallow\" studies from the late 1960s onward found that preschoolers who waited longer tended to do better years later, though the strength of that link has been debated."
  wiki: Delayed_gratification
- term: intraclass_correlation
  title: ICC
  name: "Intraclass Correlation (ICC)"
  def: "The intraclass correlation coefficient (ICC) measures how much people within the same group, such as children in one classroom, resemble each other compared with people in other groups. It runs from 0 to 1: an ICC of 0 means the group someone belongs to tells you nothing about their score, while larger values mean a sizeable share of the differences between people lies between groups. It is also used to measure how consistently a test gives the same score twice."
  wiki: Intraclass_correlation
- term: amyloid_beta
  title: Amyloid Beta
  def: "Amyloid beta (Aβ) is a family of small protein fragments cut from a larger protein made by many cells, including nerve cells. In Alzheimer's disease they clump together into the plaques found in the brain. Two common forms, Aβ40 and Aβ42, also circulate in the blood, and researchers have studied their levels and the ratio between them as possible markers of dementia risk."
  wiki: Amyloid_beta
- term: ces_d
  title: CES-D
  name: "Center for Epidemiologic Studies Depression Scale (CES-D)"
  def: "The Center for Epidemiologic Studies Depression Scale (CES-D) is a 20-item questionnaire asking how often, over the past week, people have had symptoms of depression such as poor sleep, low mood or feeling that everything was an effort. Total scores range from 0 to 60, with higher scores meaning more symptoms. It was designed for screening and research in the general population, not for diagnosing depression."
  wiki: Center_for_Epidemiologic_Studies_Depression_Scale
- term: gene_coexpression_network
  title: Gene Co-expression Network
  def: "A gene co-expression network is a map of which genes tend to become more or less active together across many samples. Researchers group tightly linked genes into modules and then look at what the genes in each module do, such as fighting infection or building proteins. This turns thousands of individual gene measurements into a smaller number of biological themes, though genes rising and falling together doesn't by itself show that one controls another."
  wiki: Gene_co-expression_network
- term: pet
  title: PET
  name: "Positron Emission Tomography (PET)"
  def: "Positron emission tomography (PET) is a brain-imaging method that tracks a small amount of a weakly radioactive tracer injected into the blood. Depending on the tracer, PET can map how much sugar brain tissue uses, how much blood reaches it, or where particular molecules, such as the amyloid deposits seen in Alzheimer disease, have built up. It shows slow, steady processes rather than moment-to-moment activity."
  wiki: Positron_emission_tomography
- term: statistical_power
  title: Statistical Power
  def: "Statistical power is the chance that a study will detect an effect of a given size if that effect is real. It rises with the number of participants and with the size of the effect: a small study may have good power to detect a large effect but little power to detect a modest one. A study with low power can miss a real effect, so a non-significant result from it is weak evidence that no effect exists."
  wiki: Power_(statistics)
- term: psilocybin
  title: Psilocybin
  def: "Psilocybin is the main psychoactive compound in \"magic mushrooms,\" a classic psychedelic drug. In the body it is converted to psilocin, which acts mainly on the brain's serotonin 2A receptors. At high doses it can profoundly alter perception, mood and the sense of self for about six hours, and in research settings it often brings experiences people describe as mystical or deeply meaningful. It is being studied in carefully screened, supervised settings as a possible treatment for depression and addiction, and is a controlled substance in most countries."
  wiki: Psilocybin
- term: blinded_experiment
  title: Double-Blind
  name: "Double-Blind Study"
  def: "In a double-blind study, neither the participants nor the researchers who deal with them know who is getting which treatment, for example the real drug or a placebo. This keeps expectations, on either side, from shaping the results. Blinding is hard to keep when a treatment has obvious effects, as high doses of psychedelic drugs do, so researchers sometimes compare against a very low dose or an active drug rather than an inert pill."
  wiki: Blinded_experiment
- term: cognitive_bias_modification
  title: Cognitive Bias Modification
  def: "Cognitive bias modification (CBM) is a set of training exercises, often simple computer tasks, that aim to change automatic habits of attention or interpretation, such as a tendency to notice threats first or to read ambiguous situations negatively. People practice, for example, shifting their attention toward neutral or positive pictures and away from negative ones. It has been studied as a treatment for anxiety and depression."
  wiki: Cognitive_bias_modification
- term: free_recall
  title: Free Recall
  def: "Free recall is a memory test in which people study a list of items, such as words, and then report as many as they can remember, in any order, with no hints. It measures what people can bring back to mind on their own. Because it captures only the end result, it can't by itself show whether a difference comes from what people noticed, how they stored the items or how they retrieved them."
  wiki: Free_recall
- term: gyrification
  title: Gyrification
  name: "Gyrification (Cortical Folding)"
  def: "Gyrification is the folding of the brain's outer layer, the cerebral cortex, into ridges (gyri) and grooves (sulci). Folding lets a large sheet of cortex fit inside the skull. The basic pattern forms before birth and is strongly influenced by genes, but the degree of folding keeps changing through childhood and adolescence. Researchers estimate it from MRI scans by measuring how sharply the brain's surface curves at each point."
  wiki: Gyrification
- term: precentral_gyrus
  title: Precentral Gyrus
  def: "The precentral gyrus is a ridge of cortex running across the top and side of each frontal lobe, just in front of the central sulcus. It houses the primary motor cortex, which sends the signals that move the body; the other side of the brain controls each side of the body."
  wiki: Precentral_gyrus
- term: fusiform_gyrus
  title: Fusiform Gyrus
  def: "The fusiform gyrus is a long ridge on the underside of each temporal lobe. It is part of the brain's visual system that identifies what we are looking at, and it is especially involved in recognizing faces, objects and written words."
  wiki: Fusiform_gyrus
- term: cuneus
  title: Cuneus
  def: "The cuneus is a wedge-shaped area on the inner surface of each occipital lobe, at the back of the brain. It takes part in basic visual processing and has been linked to directing and holding visual attention."
  wiki: Cuneus
- term: cognitive_reappraisal
  title: Cognitive Reappraisal
  def: "Cognitive reappraisal is a way of regulating emotions by changing how you think about a situation so that it affects you differently, for example by reminding yourself that a frightening film scene is staged, or seeing a setback as a chance to learn. It is one of the most studied emotion regulation strategies and a core skill in cognitive behavioral therapy. Brain-imaging studies link it to prefrontal regions involved in deliberate, effortful control."
  wiki: Cognitive_reappraisal
- term: multivoxel_pattern_analysis
  title: MVPA
  name: "Multivoxel Pattern Analysis (MVPA)"
  def: "Multivoxel pattern analysis (MVPA) is a family of brain-imaging methods that look at the pattern of activity across many small points (voxels) at once, rather than at how strongly one region responds. Often with machine learning, researchers train a pattern on one set of scans to recognize a mental state, such as physical pain, then test it on new people. A pattern that works reliably is sometimes called a brain \"signature\" of that state."
  wiki: Multivoxel_pattern_analysis
- term: reliable_change
  title: Reliable Change
  def: "Reliable change is a way of judging whether one person's score on a questionnaire has changed by more than measurement error alone would explain. The threshold depends on how widely scores vary and how consistent the questionnaire is, so a smaller change could just be noise. Researchers often pair it with clinical significance, asking whether a score also crossed into or out of the range typical of people with a disorder. A reliable change shows that something changed, not what caused it."
- term: hamilton_depression_scale
  title: HAM-D
  name: "Hamilton Depression Rating Scale (HAM-D)"
  def: "The Hamilton Depression Rating Scale (HAM-D or HRSD) is a questionnaire that a clinician fills in after interviewing a patient, rating the severity of depressive symptoms such as low mood, guilt, poor sleep, loss of interest, anxiety and physical complaints. It was introduced by Max Hamilton in 1960 and comes in several lengths, most often 17 or 24 items; higher scores mean more severe depression. It is one of the most widely used outcome measures in depression trials, which often count a fall of 50% or more as a response to treatment."
  wiki: Hamilton_Rating_Scale_for_Depression
- term: mmse
  title: MMSE
  name: "Mini-Mental State Examination (MMSE)"
  def: "The Mini-Mental State Examination (MMSE) is a brief pencil-and-paper test of overall thinking ability, scored out of 30. It asks about orientation (the date and place), memory for a few words, attention and arithmetic, language and copying a drawing, and takes about ten minutes. It is widely used to screen for dementia, with scores below about 24 suggesting impairment. Healthy adults usually score near the top, so it is not designed to pick up small changes in people without impairment."
  wiki: Mini–Mental_State_Examination
- term: trail_making_test
  title: Trail Making Test
  def: "The Trail Making Test is a timed pencil-and-paper test of attention and mental flexibility. In Part A, a person draws a line connecting numbered circles in order (1, 2, 3...) as fast as possible; in Part B, they alternate between numbers and letters (1, A, 2, B...). Part A mainly measures processing speed, while Part B adds the need to switch between two sequences and is used as a measure of executive function. Scores are the seconds taken, so lower is better."
  wiki: Trail_Making_Test
- term: sf_36
  title: SF-36
  name: "SF-36 Health Survey"
  def: "The SF-36 (Short Form 36) is a widely used 36-item questionnaire in which people rate their own health and how it affects daily life. Its eight scales cover physical functioning, pain, general health, energy, social functioning, emotional well-being and how much physical or emotional problems limit everyday roles. These combine into two summary scores, one for physical and one for mental health (the mental component summary, or MCS); higher scores mean better health."
  wiki: SF-36
- term: one_tailed_test
  title: One-Tailed Test
  def: "A one-tailed (or one-sided) test checks for a difference in only one direction, for example whether a treatment group improved more than a control group, and ignores the possibility that it did worse. When the result goes in the predicted direction, its p-value is typically half that of the usual two-tailed test, which looks for a difference in either direction, so a result is easier to call significant. It is appropriate only when a difference in the other direction is ruled out or of no interest in advance, and many journals and reviewers prefer two-tailed tests."
  wiki: One-_and_two-tailed_tests
- term: kundalini_yoga
  title: Kundalini Yoga
  def: "Kundalini yoga is a style of yoga that combines breathing exercises, postures, chanting of mantras, hand positions (mudras) and meditation. It draws on older Hindu and Sikh traditions and was popularized in the West from the late 1960s by Yogi Bhajan. Its practices include Kirtan Kriya, a short meditation that pairs chanting the sounds \"Saa, Taa, Naa, Maa\" with repeated finger movements."
  wiki: Kundalini_yoga
- term: psychomotor_vigilance_task
  title: PVT
  name: "Psychomotor Vigilance Task (PVT)"
  def: "The psychomotor vigilance task (PVT) is a simple reaction-time test of sustained alertness. For about ten minutes, a person watches a small display and presses a button as fast as possible whenever a counter starts, at random intervals. Well-rested people respond in roughly 200–300 milliseconds and rarely miss; with sleep loss, responses slow and lapses become more common, which makes the PVT a standard measure of the effects of sleep deprivation."
  wiki: Psychomotor_vigilance_task
- term: actigraphy
  title: Actigraphy
  def: "Actigraphy estimates sleep and wake from movement, recorded by a small device worn on the wrist like a watch for days or weeks. Because people move much less when asleep, the record gives an objective estimate of when and how long someone sleeps in everyday life. It is less detailed than a sleep-lab recording with polysomnography, and can mistake lying still while awake for sleep."
  wiki: Actigraphy
- term: sleep_inertia
  title: Sleep Inertia
  def: "Sleep inertia is the grogginess and slowed thinking that follow waking up. Reaction times, memory and decision-making are worse for a while after waking, usually from a few minutes to about half an hour, and the effect is stronger when someone wakes from deep slow-wave sleep or after sleep deprivation. It is why a long nap can leave people feeling worse at first."
  wiki: Sleep_inertia
- term: multiple_sleep_latency_test
  title: MSLT
  name: "Multiple Sleep Latency Test (MSLT)"
  def: "The Multiple Sleep Latency Test (MSLT) measures daytime sleepiness. Over one day, a person is given four or five chances, about two hours apart, to nap in a quiet, dark room, and the time it takes to fall asleep (the sleep latency) is recorded with EEG. Falling asleep within a few minutes on average points to excessive sleepiness or sleep debt, while taking much longer suggests normal alertness."
  wiki: Multiple_Sleep_Latency_Test
- term: acth
  title: ACTH
  name: "Adrenocorticotropic Hormone (ACTH)"
  def: "Adrenocorticotropic hormone (ACTH) is a hormone released by the pituitary gland, at the base of the brain, when the body is under stress. It travels in the blood to the adrenal glands and signals them to release cortisol, making it the middle step of the HPA axis. ACTH rises and falls within minutes, faster than cortisol, and is measured in blood rather than saliva."
  wiki: Adrenocorticotropic_hormone
- term: area_under_the_curve
  title: Area Under the Curve
  name: "Area Under the Curve (AUC)"
  def: "The area under the curve (AUC) sums up a series of measurements taken over time as a single number: plot the level of, say, a hormone at each sample, join the points, and measure the area beneath the line. Stress researchers often use a version calculated with respect to increase, which counts only the rise above the first sample, so it reflects how strongly and for how long a level rose during a stressful task."
  wiki: Area_under_the_curve_(pharmacokinetics)
- term: inverted_u
  title: Inverted-U Relationship
  def: "An inverted-U relationship is one in which more of something helps up to a point and then starts to hurt, so a graph of the outcome against the amount rises, peaks and falls, like an upside-down U. The classic example is the Yerkes–Dodson law, from 1908, usually summarized as performance improving with arousal up to an optimal level and then declining as arousal climbs further. Psychologists also call this a non-monotonic relationship or the too-much-of-a-good-thing effect."
  wiki: Yerkes–Dodson_law
- term: experiential_avoidance
  title: Experiential Avoidance
  def: "Experiential avoidance is the attempt to avoid, suppress or escape unwanted inner experiences, such as painful thoughts, feelings, memories or bodily sensations, even when doing so backfires in the long run. High levels are linked with many forms of anxiety, depression and substance use, and loosening it is a central aim of acceptance-based therapies."
  wiki: Experiential_avoidance
- term: exposure_therapy
  title: Exposure Therapy
  def: "Exposure therapy is a psychological treatment in which a person deliberately and repeatedly faces what they fear or avoid, such as objects, situations, memories or bodily sensations, in a safe setting, so that the fear response gradually fades. It is a standard treatment for phobias and other anxiety disorders, obsessive-compulsive disorder and PTSD."
  wiki: Exposure_therapy
- term: confounding
  title: Confounding
  def: "Confounding happens when a third factor influences both of the things a study compares, creating or hiding a link between them. If people who exercise also tend to eat better, for example, a link between exercise and health may partly reflect diet. Researchers measure likely confounders and adjust for them statistically, but they can't adjust for factors they didn't measure; random assignment is the surest way to rule confounding out. In confounding by indication, the reason someone takes up a treatment, such as feeling stressed, is itself linked to the outcome being studied."
  wiki: Confounding
- term: cohort_study
  title: Cohort Study
  def: "A cohort study follows a defined group of people, the cohort, over time, measuring their characteristics and habits and recording what happens to them. Because the researchers don't assign anything, it can show which things go together and which come first, but not on its own that one causes the other. Large population cohorts often invite everyone above a certain age in a district and re-examine them every few years."
  wiki: Cohort_study
- term: death_anxiety
  title: Death Anxiety
  def: "Death anxiety is fear or unease about death: one's own dying and death, the process of dying, or the deaths of others. Researchers usually measure it with questionnaires that separate these fears, since someone may dread a painful dying more than being dead. In terror management theory, a largely unconscious anxiety about death is held to drive many everyday attitudes and behaviors."
  wiki: Death_anxiety
- term: karma
  title: Karma
  def: "In Buddhism, karma is intentional action and the consequences it carries forward. Wholesome and unwholesome actions leave traces that shape a person's later experience, in this life and, on the traditional view, in future lives, so that one life gives rise to the next in an unbroken chain of cause and effect called rebirth. Buddhist teaching holds that this cycle is marked by suffering, and that liberation (nirvana) means leaving it."
  wiki: Karma_in_Buddhism
- term: four_noble_truths
  title: Four Noble Truths
  def: "The Four Noble Truths are the core of the Buddha's teaching: life involves suffering and dissatisfaction (including birth, aging, illness and death); suffering has a cause, craving and clinging, above all to a lasting self; suffering can end (nirvana); and there is a path to its end, the Noble Eightfold Path, whose eight factors include right mindfulness and right concentration."
  wiki: Four_Noble_Truths
- term: yogacara
  title: Yogācāra
  def: "Yogācāra (\"practice of yoga\") is a school of Mahayana Buddhist philosophy, founded in India in the 4th century and influential in China, Tibet and Japan. It holds that what we experience as a self and an outside world are constructions of the mind. It describes eight kinds of consciousness: the five senses, ordinary thinking, a self-grasping mind (manas) that mistakes the flow of experience for a lasting self, and a \"storehouse\" consciousness (ālaya-vijñāna) that holds the seeds of past actions and carries them forward."
  wiki: Yogachara
- term: diaphragmatic_breathing
  title: Diaphragmatic Breathing
  def: "Diaphragmatic breathing, also called belly or abdominal breathing, is breathing driven mainly by the diaphragm, the dome-shaped muscle under the lungs. As it contracts, the belly rather than the chest rises, and breaths become deeper and slower. It is taught in yoga, tai chi and many relaxation and meditation practices, and is often used as a way to calm the body."
  wiki: Diaphragmatic_breathing
- term: sustained_attention
  title: Sustained Attention
  def: "Sustained attention is the ability to keep focusing on a task over a period of time, such as watching for rare targets or working steadily through a repetitive test, without drifting off or slipping up. It is usually measured by how accurately and quickly people keep responding as the task goes on, and it tends to suffer with fatigue, boredom and stress."
  wiki: Attention_span
- term: valence
  title: Valence
  name: "Emotional Valence"
  def: "In psychology, valence is how pleasant or unpleasant something is, from negative through neutral to positive. Together with arousal, it is one of the two main dimensions researchers use to describe emotions and emotional material such as words, pictures and sounds. Word lists used in research give each word an average valence rating collected from many people, and in experiments people are often asked to rate it themselves on a scale running from very negative to very positive."
  wiki: Valence_(psychology)
- term: arousal
  title: Arousal
  name: "Emotional Arousal"
  def: "In emotion research, arousal is how stirring or calming something is, from quiet and low-energy to excited or alarmed, whatever its valence. Words like \"panic\" and \"sadness\" are both negative, for example, but panic is high in arousal and sadness low. Along with valence, it is one of the two main dimensions used to describe emotions and emotional words, pictures and sounds."
  wiki: Arousal
- term: sleep_onset_latency
  title: Sleep Onset Latency
  def: "Sleep onset latency is how long it takes to fall asleep, counted from lights out or the start of trying to sleep. It can be reported by the sleeper, estimated from movement with a wrist-worn device, or measured from brain activity in a sleep recording. Regularly taking more than about 30 minutes to fall asleep is a common sign of insomnia."
  wiki: Sleep_onset_latency
- term: wake_after_sleep_onset
  title: WASO
  name: "Wake After Sleep Onset (WASO)"
  def: "Wake after sleep onset (WASO) is the total time spent awake during the night after first falling asleep, added up across all the awakenings until the final one in the morning. It is a standard measure of how broken a night's sleep is, and can be estimated from sleep diaries, wrist-worn devices or a full sleep recording. Lying awake for more than about 30 minutes a night is a common sign of insomnia."
  wiki: Wake_after_sleep_onset
- term: sleep_hygiene
  title: Sleep Hygiene
  def: "Sleep hygiene is a set of everyday habits and conditions thought to support good sleep, such as keeping regular sleep and wake times, limiting caffeine, alcohol and screens before bed, and keeping the bedroom dark, quiet and cool. Sleep hygiene advice is a common part of insomnia treatment, but on its own it usually helps less than structured therapies such as CBT-I."
  wiki: Sleep_hygiene
- term: psychosis
  title: Psychosis
  def: "Psychosis is a state in which a person loses touch with reality in important ways, most often through hallucinations (perceiving things that aren't there, such as hearing voices) and delusions (fixed false beliefs, such as being persecuted). It is a feature of several conditions, including schizophrenia, bipolar disorder and severe depression, and can also be brought on by drugs, extreme sleep loss or physical illness. It is usually treated with antipsychotic medication and psychological support."
  wiki: Psychosis
- term: case_series
  title: Case Series
  def: "A case series describes a small group of patients who share an exposure or an illness, such as people who became unwell after a particular practice, usually drawn from clinicians' own work. It can flag a possible link and suggest ideas to test, but with no comparison group and no count of how many people had the same exposure without becoming ill, it can't show cause or how common the outcome is."
  wiki: Case_series
- term: theravada
  title: Theravada
  name: "Theravada Buddhism"
  def: "Theravada (Pali for \"teaching of the elders\") is the oldest surviving school of Buddhism and the main religion of Sri Lanka, Thailand, Myanmar, Cambodia and Laos. It takes the Pali Canon as its scripture and emphasizes meditation and insight into impermanence, suffering and not-self. The Insight (vipassana) meditation movement and the jhana practices studied in some meditation research come from this tradition."
  wiki: Theravada
- term: epworth_sleepiness_scale
  title: Epworth Sleepiness Scale
  def: "The Epworth Sleepiness Scale is a short questionnaire that measures daytime sleepiness. People rate how likely they would be to doze off in eight everyday situations, such as reading, watching TV or sitting in a stopped car in traffic, from 0 (would never doze) to 3 (high chance of dozing). The total runs from 0 to 24, with higher scores meaning sleepier days."
  wiki: Epworth_Sleepiness_Scale
- term: sleep_diary
  title: Sleep Diary
  def: "A sleep diary is a daily log, usually filled in each morning, of when a person went to bed, how long it took to fall asleep, how often they woke in the night, when they got up and how well they felt they slept. It is a standard way to track sleep over weeks, but because it relies on people's own estimates it can differ from sleep measured with recording devices such as polysomnography or wrist-worn activity monitors."
  wiki: Sleep_diary
- term: biofeedback
  title: Biofeedback
  def: "Biofeedback uses sensors to show people a body signal they can't normally perceive, such as heart rate, breathing or muscle tension, on a screen in real time, so they can learn to change it. In heart rate variability biofeedback, people watch their heart rhythm while slowing their breathing, usually to around 6 breaths a minute, until the rises and falls in heart rate become as large as possible. Courses typically run over several weekly sessions with practice at home."
  wiki: Biofeedback
- term: respiratory_sinus_arrhythmia
  title: Respiratory Sinus Arrhythmia
  def: "Respiratory sinus arrhythmia is the natural rise in heart rate as we breathe in and fall as we breathe out. Despite the name, it is normal and healthy, not a disorder. It is driven largely by the vagus nerve, which slows the heart, so its size is often used as a marker of parasympathetic (\"rest and digest\") activity. Slow breathing, at around 6 breaths a minute, makes these swings much larger."
  wiki: Respiratory_sinus_arrhythmia
- term: baroreflex
  title: Baroreflex
  def: "The baroreflex is the body's automatic control loop for blood pressure. Stretch sensors in the walls of major arteries detect when pressure rises or falls, and the brainstem responds within a heartbeat or two by slowing or speeding the heart and relaxing or tightening blood vessels. Its sensitivity tends to be lower in chronic stress and in heart disease, and slow breathing is thought to exercise it."
  wiki: Baroreflex
- term: pasat
  title: PASAT
  name: "Paced Auditory Serial Addition Test (PASAT)"
  def: "The Paced Auditory Serial Addition Test (PASAT) is a demanding mental arithmetic task. People hear a stream of single digits and must add each new digit to the one before it and say the answer aloud, while the next digit is already coming. Originally developed to assess attention and processing speed, it is also used in research as a brief laboratory stressor, because it reliably raises heart rate, blood pressure and frustration."
  wiki: Paced_Auditory_Serial_Addition_Test
- term: factorial_design
  title: Factorial Design
  def: "A factorial design is an experiment that tests several factors at once by randomly assigning people to every combination of them. A study crossing three practices with two session lengths, for example, has six groups. Each factor's effect can then be estimated from the whole sample rather than from a separate experiment, and researchers can check for interactions, where the effect of one factor depends on the level of another."
  wiki: Factorial_experiment
- term: roc_curve
  title: ROC Curve
  name: "Receiver Operating Characteristic (ROC) Curve"
  def: "A receiver operating characteristic (ROC) curve shows how well a test or prediction model separates people who have an outcome from people who don't. The area under it (AUC) sums this up as one number: 0.5 means the model does no better than a coin toss, and 1.0 means it sorts everyone correctly. An AUC of 0.7 means that if you pick one person with the outcome and one without, the model ranks the first as higher risk 70% of the time. Values around 0.7 to 0.8 are usually called acceptable, not strong."
  wiki: Receiver_operating_characteristic
- term: fdg_pet
  title: FDG-PET
  name: "Fluorodeoxyglucose PET (FDG-PET)"
  def: "FDG-PET is a kind of PET scan whose tracer, fluorodeoxyglucose (FDG), is a weakly radioactive form of glucose. Brain cells take it up much as they take up ordinary sugar, so the scan maps how much energy each region is using, a measure usually called glucose metabolism. Glucose metabolism in parts of the brain tends to fall with age, and lower metabolism in particular regions is one of the signs used in diagnosing Alzheimer's disease."
  wiki: Fludeoxyglucose_(18F)
- term: salience_network
  title: Salience Network
  def: "The salience network is a set of brain regions, centered on the front of the insula and the anterior cingulate cortex, whose activity tends to rise and fall together. It is thought to pick out what matters most at a given moment, whether from inside the body or from the outside world, and to help the brain switch between inward-focused thought and outward-focused tasks. It is closely tied to awareness of the body's internal state."
  wiki: Salience_network
- term: frontal_alpha_asymmetry
  title: Frontal Alpha Asymmetry
  def: "Frontal alpha asymmetry compares the strength of alpha waves, recorded with EEG, over the left and right sides of the front of the head. Alpha is thought to be weaker where the cortex is more active, so relatively less alpha on the left is read as relatively more left-sided activity. That pattern has been linked with approach motivation, the pull toward things, and with positive emotion (and also with anger), while relatively more right-sided activity has been linked with withdrawal, emotions such as sadness and fear, and risk of depression. It is an indirect marker, and studies of it have often disagreed."
  wiki: Frontal_EEG_asymmetry
- term: socioemotional_selectivity_theory
  title: Socioemotional Selectivity Theory
  def: "Socioemotional selectivity theory, developed by the psychologist Laura Carstensen, holds that as people come to see their time as limited, as typically happens with age, their goals shift from gathering information and new experiences toward emotionally meaningful ones. It helps explain why older adults often report emotional well-being as good as or better than younger adults', and why they tend to favor a smaller circle of close relationships."
  wiki: Socioemotional_selectivity_theory
- term: nucleus_accumbens
  title: Nucleus Accumbens
  def: "The nucleus accumbens is a small region deep in each half of the brain, part of the ventral striatum. It is a key hub of the brain's reward system: it responds to pleasant things and to the expectation of them, and it helps turn motivation into action. Brain-imaging studies have also linked it to charitable giving."
  wiki: Nucleus_accumbens
- term: dna_methylation
  title: DNA Methylation
  def: "DNA methylation is the attachment of a small chemical tag, a methyl group, to DNA, usually at a cytosine that is followed by a guanine (a CpG site). It doesn't change the DNA sequence, but heavy methylation of a gene's promoter, the stretch of DNA that controls when the gene is read, tends to keep the gene switched off. It is one of the main epigenetic marks, and its level can be measured site by site."
  wiki: DNA_methylation
- term: habituation
  title: Habituation
  def: "Habituation is the gradual weakening of a response to something that is repeated and turns out to be harmless. In brain-imaging studies it is often measured as activity in a region declining across repeated trials; the opposite, a response that grows with repetition, is called sensitization."
  wiki: Habituation
- term: beck_depression_inventory
  title: BDI-II
  name: "Beck Depression Inventory-II (BDI-II)"
  def: "The Beck Depression Inventory-II (BDI-II) is a 21-item questionnaire on which people rate how much they have experienced common symptoms of depression over the past two weeks, such as sadness, loss of pleasure, guilt, tiredness and changes in sleep or appetite. Each item is scored from 0 to 3, for a total of 0 to 63, where higher means more severe symptoms. It measures symptoms rather than diagnosing depression."
  wiki: Beck_Depression_Inventory
- term: responsive_neurostimulation
  title: Responsive Neurostimulation
  def: "Responsive neurostimulation (RNS) is a treatment for epilepsy that doesn't respond to medication. A small device implanted in the skull is wired to electrodes placed where seizures are thought to begin; it continuously monitors the brain's electrical activity and delivers brief pulses of stimulation when it detects patterns that can lead to a seizure. Because the electrodes stay in place long-term, researchers can also record activity from deep brain structures, with patients' consent, while they go about ordinary activities."
  wiki: Responsive_neurostimulation_device
  def: "The nucleus accumbens is a small region deep in the brain, part of the ventral striatum, that is central to reward and motivation. It receives signals from dopamine neurons in the brainstem and responds to pleasures such as food, sex, music and money, and to cues that predict them. Addictive drugs strongly activate it."
  wiki: Nucleus_accumbens
