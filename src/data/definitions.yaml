- term: brahmaviharas
  title: Brahmavihārās
  def: "Brahma Vihara meditation, also known as the Four Immeasurables, involves cultivating four qualities: loving-kindness (metta), compassion (karuna), empathetic joy (mudita), and equanimity (upekkha). It aims to develop a state of unconditional love, compassion towards suffering, joy in the happiness of others, and a balanced mind in all situations."
  wiki: Brahmavihara
- term: dmn
  title: DMN
  name: "Default Mode Network (DMN)"
  def: "The default mode network (DMN) is a system of connected brain areas that show increased activity when a person is not focused on what is happening around them, such as during daydreaming and mind-wandering. It can also be active when the individual is thinking about others or themselves, remembering the past, and planning for the future."
  wiki: Default_mode_network
- term: eeg
  title: EEG
  name: "Electroencephalography (EEG)"
  def: An electroencephalogram (EEG) is a recording of brain activity. During this painless test, small sensors are attached to the scalp to pick up the electrical signals produced by the brain.
  wiki: Electroencephalography
- term: flanker_test
  title: Flanker Test
  def: "The flanker test is a cognitive task used to measure interference control—the ability to focus attention on relevant stimuli while suppressing responses to irrelevant distractions. Participants respond to a central target stimulus surrounded by distracting 'flanker' stimuli. Performance on this task reflects the efficiency of controlled and automatic attentional processes."
  wiki: Eriksen_flanker_task
- term: fmri
  title: fMRI
  name: "Functional MRI (fMRI)"
  def: An fMRI (functional Magnetic Resonance Imaging) measures changes in blood flow related to neural activity in the brain, offering insights into brain function and activity patterns.
  wiki: Functional_magnetic_resonance_imaging
- term: gamma
  title: Gamma
  name: "Gamma Waves"
  def: "Gamma brain waves are a type of brainwave pattern that oscillate at approximately 25 to 100 Hz. Gamma waves are associated with states of heightened perception, problem-solving, and consciousness. Gamma waves play a crucial role in cognitive functioning, including memory, and information processing, and are thought to integrate thoughts and information from different parts of the brain."
  wiki: Gamma_wave
- term: inflammation
  title: Inflammation
  def: "Inflammation is a biological response of the immune system to injury, infection, or stress, characterized by the release of signaling molecules called cytokines. Chronic inflammation is linked to impaired cognitive function, increased risk of disease, and accelerated aging."
  wiki: Inflammation
- term: jhana
  title: Jhana
  def: "Jhana refers to states of deep concentration or meditative absorption in Buddhist practice, achieved through intense focus and mindfulness. These states represent progressive levels of mental and emotional calm, clarity, and bliss, cultivated through the practice of meditation, leading to profound insight and enlightenment."
  wiki: Dhyāna_in_Buddhism
- term: mbsr
  title: MBSR
  name: "Mindfulness-Based Stress Reduction (MBSR)"
  def: "Mindfulness-Based Stress Reduction (MBSR) is a program designed to help individuals cope with stress, pain, and illness. Developed by Jon Kabat-Zinn in the 1970s, it combines meditation and yoga to promote awareness and stress management. The eight-week program teaches participants to focus on the present moment non-judgmentally, enhancing their ability to manage difficulties."
  wiki: Mindfulness-based_stress_reduction
- term: randomized_controlled_trial
  title: Randomized Controlled Trial
  def: A Randomized Controlled Trial is a scientific study design that randomly assigns participants to either an experimental group receiving an intervention or a control group, allowing researchers to measure the true effect of the intervention while minimizing bias.
  wiki: Randomized_controlled_trial
- term: telomeres
  title: Telomeres
  def: "Telomeres are protective caps at the end of chromosomes that shorten with each cell division. Telomere length is associated with aging and health, with longer telomeres linked to better health and longevity. Stress and lifestyle factors can affect telomere length, making them a potential marker of health and aging."
  wiki: Telomere
- term: depersonalization
  title: Depersonalization
  def: "Depersonalization is a dissociative experience characterized by feelings of detachment from one's self, body, or mental processes. Individuals experiencing depersonalization may feel like an outside observer of their thoughts, feelings, or body, or they may feel as if they're in a dream. It can occur as a temporary response to stress, as a symptom of psychiatric disorders, or as a feature of certain meditation experiences."
  wiki: Depersonalization
- term: mind_wandering
  title: Mind Wandering
  def: "Mind wandering is the spontaneous shift of attention away from a current task or external environment to internally generated thoughts, memories, or fantasies. This common cognitive process is associated with default mode network activation and has been extensively studied in relation to meditation practices, which often aim to reduce mind wandering."
  wiki: Mind_wandering
- term: mindfulness
  title: Mindfulness
  def: "Mindfulness is the psychological process of purposely bringing one's attention to experiences occurring in the present moment without judgment. It involves maintaining awareness of thoughts, feelings, bodily sensations, and surrounding environment with an attitude of curiosity and acceptance. In meditation contexts, mindfulness practices typically involve focusing attention on the breath or body sensations as anchors to the present moment while acknowledging and releasing distracting thoughts."
  wiki: Mindfulness
- term: beta
  title: Beta
  name: "Beta Waves"
  def: "Beta brain waves are a type of brainwave pattern that oscillate between approximately 12 to 30 Hz. Beta waves are typically associated with active thinking, focus, alertness, and engagement with the external world. They are prominent during conscious, goal-directed activity and are linked to cognitive tasks such as problem-solving, decision-making, and sustained attention."
  wiki: Beta_wave
- term: telomerase
  title: Telomerase
  def: "Telomerase is an enzyme that helps maintain telomere length by adding repetitive DNA sequences to the ends of chromosomes. It plays a crucial role in cellular aging and longevity, as it can counteract the natural shortening of telomeres that occurs with cell division. This enzyme is particularly active in stem cells, germline cells, and cancer cells, while its activity is typically low in most mature somatic cells, contributing to cellular senescence and aging."
  wiki: Telomerase
- term: effect_size
  title: Effect Size
  def: "Effect size is a statistical concept that quantifies the magnitude or strength of a relationship, difference, or intervention outcome. Unlike p-values which only indicate statistical significance, effect sizes measure how meaningful a result is in practical terms. Common measures include Cohen's d (standardized mean difference), correlation coefficients (r), and odds ratios. In meditation research, effect sizes help quantify the practical impact of different meditation practices on psychological or physiological outcomes."
  wiki: Effect_size
- term: vipassana
  title: Vipassana
  def: "Vipassana is a form of Buddhist meditation focused on the cultivation of insight through moment-to-moment awareness of bodily sensations, thoughts, and emotions. It emphasizes non-reactivity and equanimity, helping practitioners observe mental and physical phenomena without attachment."
  wiki: Vipassanā
- term: rem_sleep
  title: REM Sleep
  def: "Rapid Eye Movement (REM) sleep is a sleep stage marked by vivid dreaming, rapid eye movements, and heightened brain activity similar to wakefulness. REM sleep supports emotional regulation, memory consolidation, and neuroplasticity. It typically increases in the later part of the night."
  wiki: Rapid_eye_movement_sleep
- term: adverse_childhood_experiences
  title: Adverse Childhood Experiences (ACEs)
  def: "Adverse childhood experiences are potentially traumatic events that happen before age 18, such as abuse, neglect, or growing up with household substance use or violence. Researchers usually measure them with a short yes/no questionnaire and add up the total. Higher ACE scores are associated with poorer physical and mental health in adulthood, and in meditation research they have been linked to a higher chance of meditation-related adverse effects."
  wiki: Adverse_childhood_experiences
- term: meditation_adverse_effects
  title: Meditation-Related Adverse Effects
  def: "Meditation-related adverse effects are unpleasant experiences that a person attributes to meditation practice, ranging from mild and brief to severe and lasting. Examples include anxiety, re-living traumatic memories, trouble sleeping and feeling disconnected from oneself or the world. Researchers usually record how long each effect lasted and whether it interfered with daily functioning."
- term: cross_sectional_study
  title: Cross-Sectional Study
  def: "A cross-sectional study measures a group of people at a single point in time. It can show which things tend to go together, but not which came first or whether one causes the other."
  wiki: Cross-sectional_study
- term: active_control_group
  title: Active Control Group
  def: "An active control group is a comparison group that takes part in a different program designed to be just as engaging as the one being tested. In meditation research, it might involve exercise, music, or education classes with the same time commitment, teachers, and expectations of benefit. Comparing against an active control helps separate the effects of meditation itself from the general effects of joining a course."
  wiki: Scientific_control
- term: amygdala
  title: Amygdala
  def: "The amygdala is a pair of almond-shaped structures deep in the brain's temporal lobes. It plays a central role in processing emotion, especially threat and fear. Meditation studies often look at how strongly the amygdala responds to emotional images, and sometimes at its size."
  wiki: Amygdala
- term: gray_matter
  title: Gray Matter
  def: "Gray matter is brain tissue made up mostly of nerve cell bodies and their connections. It forms the brain's outer layer (the cortex) and several deeper structures. Structural MRI can estimate gray matter volume (how big a region is), density (how concentrated the tissue is), and cortical thickness (how deep the outer layer is)."
  wiki: Grey_matter
- term: neuroplasticity
  title: Neuroplasticity
  def: "Neuroplasticity is the brain's ability to change its structure and function in response to experience. Changes can include new connections between neurons and shifts in the size of brain regions. Researchers have looked for structural neuroplasticity after meditation training, much as it has been found after exercise or learning new skills."
  wiki: Neuroplasticity
- term: meta_analysis
  title: Meta-Analysis
  def: "A meta-analysis statistically combines the results of many earlier studies on the same question. Pooling the data can estimate an overall effect more precisely than any single study and show whether results agree across studies. Its conclusions are only as good as the studies it includes and how similar they are."
  wiki: Meta-analysis
- term: cbt_i
  title: CBT-I
  name: "Cognitive Behavioral Therapy for Insomnia (CBT-I)"
  def: "Cognitive behavioral therapy for insomnia (CBT-I) is a structured, usually short-term talk therapy for chronic sleeplessness. It combines changes to sleep habits and schedules, such as limiting time in bed, with work on unhelpful thoughts about sleep. It is widely recommended as a first-line treatment for insomnia."
  wiki: Cognitive_behavioral_therapy_for_insomnia
- term: psqi
  title: PSQI
  name: "Pittsburgh Sleep Quality Index (PSQI)"
  def: "The Pittsburgh Sleep Quality Index (PSQI) is a widely used questionnaire about how well a person has slept over the past month. It covers time to fall asleep, sleep duration, disturbances and daytime effects, and combines them into a score from 0 to 21, where higher means worse sleep. Scores above 5 are commonly taken to indicate poor sleep."
  wiki: Pittsburgh_Sleep_Quality_Index
- term: cortical_thickness
  title: Cortical Thickness
  def: "Cortical thickness is the depth of the cerebral cortex, the brain's folded outer layer of gray matter. It is estimated from MRI scans as the distance between the cortex's outer surface and the white matter underneath. Researchers track it over time to look for training-related change, though it can't show what changed at the level of cells."
  wiki: Cortical_thickness
- term: theory_of_mind
  title: Theory of Mind
  def: "Theory of mind is the ability to work out what another person thinks, believes or intends. It is also called mentalizing or cognitive perspective-taking. It is usually distinguished from empathy, which involves sharing another person's feelings rather than reasoning about their thoughts."
  wiki: Theory_of_mind
- term: insula
  title: Insula
  def: "The insula is a region of cortex folded deep inside each side of the brain. It helps represent the body's internal state (interoception) and is involved in emotion, empathy and compassion. Its front part, the anterior insula, comes up often in meditation research."
  wiki: Insular_cortex
- term: alpha
  title: Alpha
  name: "Alpha Waves"
  def: "Alpha waves are rhythmic electrical brain activity at roughly 8–13 cycles per second, recorded with EEG. They are often strongest when the eyes are closed and the mind is relaxed, and are thought to help filter out or hold back information as part of top-down control. Meditation studies have reported both increases and decreases in alpha, depending on the practice."
  wiki: Alpha_wave
- term: functional_connectivity
  title: Functional Connectivity
  def: "Functional connectivity is the degree to which activity in different brain regions rises and falls together over time. It is usually measured with fMRI as the correlation between regions' signals. It shows coordinated activity, not physical wiring. Researchers use it to see how brain networks such as the DMN communicate in different mental states."
  wiki: Functional_connectivity
- term: lempel_ziv_complexity
  title: Lempel-Ziv Complexity
  def: "Lempel-Ziv complexity is a measure of how varied, or unpredictable, a signal is. Applied to EEG, it counts how many distinct patterns appear in a recording: a repetitive signal scores low, and a richly varied one scores high. It is often used as a rough index of brain \"entropy\" and has been found to rise in psychedelic states."
  wiki: Lempel–Ziv_complexity
- term: neurophenomenology
  title: Neurophenomenology
  def: "Neurophenomenology is a research approach that pairs detailed first-person reports of experience with measurements of brain activity, using each to help interpret the other. Proposed by neuroscientist Francisco Varela in the 1990s, it depends on participants who can observe and describe their experience precisely, which makes experienced meditators natural collaborators."
  wiki: Neurophenomenology
- term: il_6
  title: IL-6
  name: "Interleukin-6 (IL-6)"
  def: "Interleukin-6 (IL-6) is a signaling protein (a cytokine) that immune cells release to coordinate inflammation. It is measured from a blood sample, usually in picograms per milliliter. Persistently elevated IL-6 is associated with chronic stress, aging and a higher risk of cardiovascular disease, which makes it a common marker in studies of whether meditation affects health."
  wiki: Interleukin_6
- term: pcc
  title: PCC
  name: "Posterior Cingulate Cortex (PCC)"
  def: "The posterior cingulate cortex (PCC) is a region toward the back of the brain's midline. It is a central hub of the default mode network and tends to be active during self-related thought and mind-wandering. Many meditation studies track PCC activity or connectivity as a window onto the DMN."
  wiki: Posterior_cingulate_cortex
- term: dlpfc
  title: dlPFC
  name: "Dorsolateral Prefrontal Cortex (dlPFC)"
  def: "The dorsolateral prefrontal cortex (dlPFC) is a region on the upper outer sides of the frontal lobes. It is a core part of the brain's executive control network, supporting working memory, directing attention and regulating emotion. Stronger dlPFC activity and connectivity have been associated with lower pain, negative emotion and stress."
  wiki: Dorsolateral_prefrontal_cortex
- term: mediation_analysis
  title: Mediation Analysis
  def: "Mediation analysis is a statistical method that tests whether a third variable helps explain the link between a cause and an effect, for example whether a brain change helps explain why a training program altered a health marker. It estimates how much of the overall effect runs through that variable. A significant result is consistent with a causal pathway but does not prove one on its own."
  wiki: Mediation_(statistics)
- term: nrem_sleep
  title: NREM Sleep
  def: "Non-rapid eye movement (NREM) sleep makes up most of a night's sleep. It runs from light sleep (stages N1 and N2) to deep, slow-wave sleep (N3), alternating with REM sleep in cycles of about 90 minutes. During NREM sleep, brain activity is dominated by slow waves and the brain responds much less to the outside world."
  wiki: Non-rapid_eye_movement_sleep
- term: polysomnography
  title: Polysomnography
  def: "Polysomnography is an overnight sleep study, usually done in a sleep lab. Sensors record brain activity (EEG), eye movements, muscle activity, heart rhythm and breathing, so that each stretch of the night can be scored as wake, light sleep, deep sleep or REM sleep, and sleep disorders such as apnea can be detected."
  wiki: Polysomnography
- term: attention_network_test
  title: Attention Network Test
  def: "The Attention Network Test (ANT) is a short computer task that measures three aspects of attention at once: alerting (getting ready for something about to happen), orienting (moving attention to a location) and executive attention (resolving conflict). People press a key to show which way a central arrow points while arrows on either side point the same way or the opposite way, and cues signal when and where the arrow will appear. Subtracting reaction times between kinds of trials gives a score for each."
  wiki: Attentional_control
- term: poms
  title: POMS
  name: "Profile of Mood States (POMS)"
  def: "The Profile of Mood States (POMS) is a questionnaire in which people rate how strongly they have felt a list of moods. It gives scores on six scales: tension–anxiety, depression–dejection, anger–hostility, fatigue–inertia, confusion–bewilderment and vigor–activity, the only positive one. Researchers use it to track short-term changes in mood, for example before and after a training program."
  wiki: Profile_of_mood_states
- term: cortisol
  title: Cortisol
  def: "Cortisol is a hormone released by the adrenal glands, especially in response to stress. It mobilizes energy and helps regulate the immune system. Because it can be measured in saliva, researchers often use it to gauge how strongly someone reacts to a stressful task, such as timed mental arithmetic. Levels also follow a daily rhythm, so studies try to test everyone at the same time of day."
  wiki: Cortisol
- term: secretory_iga
  title: Secretory IgA
  def: "Secretory immunoglobulin A (sIgA) is the main antibody in saliva, tears and the mucous linings of the gut and airways, where it forms a first line of defense against germs. Because it can be measured from a saliva sample, stress researchers use it as a marker of immune activity."
  wiki: Immunoglobulin_A
- term: mbct
  title: MBCT
  name: "Mindfulness-Based Cognitive Therapy (MBCT)"
  def: "Mindfulness-based cognitive therapy (MBCT) is an 8-week group program that combines mindfulness meditation, adapted from Mindfulness-Based Stress Reduction (MBSR), with elements of cognitive behavioral therapy. It was developed to help people who have recovered from depression avoid relapse, by learning to notice and step back from patterns of negative thinking. Classes usually meet weekly, with daily meditation practice at home."
  wiki: Mindfulness-based_cognitive_therapy
- term: dissociation
  title: Dissociation
  def: "Dissociation is a disruption in the usual integration of thoughts, feelings, perceptions, memory and sense of self. Mild forms, such as daydreaming or 'zoning out', are common. More marked forms include depersonalization (feeling detached from oneself), derealization (feeling that the world is unreal) and emotional numbing. Dissociation can be a response to stress or trauma and is a feature of several psychiatric conditions."
  wiki: Dissociation_(psychology)
- term: derealization
  title: Derealization
  def: "Derealization is an experience in which the outside world feels unreal, distant, dreamlike or flat, as if seen through a fog or a pane of glass. It often occurs together with depersonalization. It can be a passing response to stress, fatigue or anxiety, and it is a symptom of some dissociative and anxiety disorders."
  wiki: Derealization
- term: attentional_blink
  title: Attentional Blink
  def: "The attentional blink is a brief gap in awareness that follows spotting something. When people watch a rapid stream of items for two targets, they often miss the second one if it appears within about half a second of the first, as if attention had blinked while the brain was still taking in the first target. It is thought to arise because the two targets compete for limited attention."
  wiki: Attentional_blink
- term: p3b
  title: P3b
  def: "The P3b is a positive brain wave, recorded with EEG, that peaks over the top and back of the head roughly 300 to 600 milliseconds after a person notices a target they were looking for. It is one part of the P300 response. Researchers use its size as a rough index of how much attention or processing the brain devotes to that target."
  wiki: P300_(neuroscience)
- term: trier_social_stress_test
  title: Trier Social Stress Test
  def: "The Trier Social Stress Test (TSST) is a standard laboratory stressor. After a few minutes to prepare, a person gives a short speech, often a mock job interview, and then does mental arithmetic aloud, in front of a panel of unsmiling judges and often a camera. The mix of public evaluation and lack of control reliably raises stress hormones such as cortisol, so researchers use it to compare how strongly people react to stress."
  wiki: Trier_social_stress_test
- term: capsaicin
  title: Capsaicin
  def: "Capsaicin is the compound that makes chili peppers hot. It activates a receptor (TRPV1) on pain-sensing nerve fibers, producing a burning sensation. In the skin, it also makes those nerves release signaling molecules that widen nearby blood vessels, causing a spreading red flare, so researchers apply capsaicin cream to provoke a small, harmless, nerve-driven inflammation."
  wiki: Capsaicin
- term: neurogenic_inflammation
  title: Neurogenic Inflammation
  def: "Neurogenic inflammation is inflammation driven by nerves rather than by infection or injury alone. When sensory nerve endings are activated, they release signaling molecules called neuropeptides, such as substance P and CGRP, that widen blood vessels, make them leakier and activate local immune cells. It is thought to help explain why stress can worsen skin conditions such as psoriasis and eczema."
  wiki: Neurogenic_inflammation
- term: tnf_alpha
  title: TNF-α
  name: "Tumor Necrosis Factor Alpha (TNF-α)"
  def: "Tumor necrosis factor alpha (TNF-α) is a signaling protein (a cytokine) that immune cells release early in inflammation. It helps fight infection and repair tissue, but high or persistent levels contribute to inflammatory diseases such as rheumatoid arthritis, psoriasis and inflammatory bowel disease."
  wiki: Tumor_necrosis_factor
- term: il_8
  title: IL-8
  name: "Interleukin-8 (IL-8)"
  def: "Interleukin-8 (IL-8) is a signaling protein (a cytokine) that draws white blood cells, especially neutrophils, to a site of infection or injury. Its levels rise in inflamed tissue, so researchers measure it as a marker of local inflammation."
  wiki: Interleukin_8
- term: voxel_based_morphometry
  title: Voxel-Based Morphometry
  def: "Voxel-based morphometry (VBM) is a way of comparing brain structure across MRI scans. Each scan is divided into a grid of tiny cubes called voxels (3D pixels). Software labels the tissue in each voxel as gray matter, white matter or fluid, and warps every brain to a standard shape so that the same voxel falls in roughly the same place in each person. Researchers then test, voxel by voxel, whether gray matter density (how much of the tissue there looks like gray matter) or volume differs between groups or changes over time."
  wiki: Voxel-based_morphometry
- term: hippocampus
  title: Hippocampus
  def: "The hippocampus is a curved structure deep in each temporal lobe of the brain. It is essential for learning and forming new memories, and it also helps regulate emotion and the stress response. It can change with experience, and it tends to be smaller in people with long-term depression or post-traumatic stress disorder."
  wiki: Hippocampus
- term: tpj
  title: TPJ
  name: "Temporoparietal Junction (TPJ)"
  def: "The temporoparietal junction (TPJ) is the area where the brain's temporal and parietal lobes meet, toward the back and side of the head. It helps combine signals from the body and senses into a sense of where the self is, and it is central to theory of mind: working out what other people think and intend."
  wiki: Temporoparietal_junction
- term: multiple_comparisons
  title: Multiple Comparisons
  def: "The multiple comparisons problem arises when researchers run many statistical tests at once. Each test has a small chance of a false positive, so across thousands of tests, such as one for every point in a brain scan, some \"significant\" results will turn up by chance alone. Corrections raise the bar for significance to keep the overall false-positive rate down, at the cost of making small real effects harder to detect."
  wiki: Multiple_comparisons_problem
- term: odds_ratio
  title: Odds Ratio
  def: "An odds ratio compares the odds of an outcome in one group with the odds in another, where the odds are the chance something happens divided by the chance it doesn't. An odds ratio of 1 means no difference, above 1 means higher odds in the first group, and below 1 lower odds. When an outcome is common, an odds ratio looks bigger than the difference in percentages: 30% versus 20% is an odds ratio of about 1.7."
  wiki: Odds_ratio
- term: repetitive_negative_thinking
  title: Repetitive Negative Thinking
  def: "Repetitive negative thinking is a habit of dwelling on problems and negative experiences, through worry about the future or rumination about the past, in a way that feels hard to stop and gets nowhere. It is common across many mental health problems, especially depression and anxiety. Researchers often measure it with the Perseverative Thinking Questionnaire."
  wiki: Perseverative_cognition
- term: theta
  title: Theta
  name: "Theta Waves"
  def: "Theta waves are rhythmic electrical brain activity at roughly 4–8 cycles per second, recorded with EEG. While awake, they are linked to memory, focused attention and drowsiness, and meditation studies often report more theta over the front of the head during practice. In sleep, theta is common in light non-REM sleep and in REM sleep."
  wiki: Theta_wave
- term: sleep_spindle
  title: Sleep Spindle
  def: "A sleep spindle is a brief burst of brain activity at about 11–16 cycles per second (the sigma band), lasting from about half a second to two seconds, seen on an EEG during non-REM sleep, especially stage N2. Spindles are thought to help shield sleep from outside noise and to support memory consolidation, and they can increase locally in brain areas used heavily for learning during the day."
  wiki: Sleep_spindle
- term: slow_wave_activity
  title: Slow-Wave Activity
  def: "Slow-wave activity (SWA) is the strength of the slowest brain rhythms of sleep, delta waves at about 1–4 cycles per second, measured with EEG. Slow waves dominate deep (N3) non-REM sleep. SWA is highest early in the night and falls as sleep goes on, and brain areas that worked hard during the day can show more of it that night, which makes it a marker of both sleep pressure and learning-related changes in the brain."
  wiki: Slow-wave_sleep
- term: shamatha
  title: Shamatha
  def: "Shamatha (Pali samatha, \"calm abiding\") is a Buddhist family of concentration practices that train attention to settle and stay on a chosen object, such as the sensations of the breath. Practitioners notice when the mind has wandered and bring it back, aiming for attention that is both stable and vivid. It is often paired with vipassana, or insight, practice."
  wiki: Samatha
- term: vigilance_decrement
  title: Vigilance Decrement
  def: "The vigilance decrement is the decline in performance as time goes on during a long, monotonous task that requires watching for rare targets, such as a radar operator looking for a blip. People typically miss more targets or make more false alarms after only a few minutes. It is the standard laboratory measure of how well sustained attention holds up."
  wiki: Vigilance_(psychology)
- term: wait_list_control
  title: Wait-List Control Group
  def: "A wait-list control group is a comparison group that receives the program being studied only after the study period, so participants who are waiting can be compared with those already taking part. It controls for the passage of time and repeated testing, but not for the attention, expectations and setting that come with taking part in any program, which an active control group can address."
  wiki: Waitlist_control_group
- term: lojong
  title: Lojong
  def: "Lojong, Tibetan for \"mind training,\" is a set of Tibetan Buddhist practices for cultivating compassion, traced to the Indian teachers Atisha and Shantideva. Rather than simply observing thoughts, it uses reasoning and reflection to question habitual attitudes toward oneself and others, such as sorting people into friends, enemies and strangers, and to extend warmth step by step to a widening circle of people, including those one dislikes."
  wiki: Lojong
- term: sleep_efficiency
  title: Sleep Efficiency
  def: "Sleep efficiency is the share of time in bed actually spent asleep: total sleep time divided by time in bed, given as a percentage. It can be measured in a sleep lab or estimated from sleep diaries or wrist-worn devices. Taking a long time to fall asleep or lying awake during the night lowers it, and values below about 85–90% are often taken as a sign of disturbed sleep."
  wiki: Sleep_efficiency
- term: slow_wave_sleep
  title: Slow-Wave Sleep
  def: "Slow-wave sleep (SWS), often called deep sleep, is the deepest stage of non-REM sleep (stage N3, or stages 3 and 4 under older scoring rules), when the EEG is dominated by large, slow delta waves. People are hardest to wake from it. It is concentrated in the first part of the night, declines with age, and is thought to support physical restoration and memory."
  wiki: Slow-wave_sleep
- term: self_selection_bias
  title: Self-Selection Bias
  def: "Self-selection bias arises when people decide for themselves whether to take part in a study, so those who do may differ from those who don't in ways that affect the results. A survey advertised as being about the unwanted effects of meditation, for example, may draw more people who have had such effects, making them look more common than they are among meditators in general."
  wiki: Self-selection_bias
- term: gene_expression
  title: Gene Expression
  def: "Gene expression is the process by which a cell reads a gene and uses it to make a product, usually by copying it into a messenger molecule (mRNA) that is then used to build a protein. Every cell carries the same DNA, but cells turn genes up and down within hours in response to signals such as hormones, infection or stress. Researchers often measure a gene's mRNA to see how active it is; that says nothing about the DNA sequence itself, which doesn't change."
  wiki: Gene_expression
- term: epigenetics
  title: Epigenetics
  def: "Epigenetics is the study of chemical marks on DNA, and on the histone proteins it is wound around, that help switch genes on or off without changing the DNA sequence. Examples include DNA methylation and the acetylation of histones. Some marks change within hours in response to the environment and others last for years, which makes them a candidate link between experience and health."
  wiki: Epigenetics
- term: histone_deacetylase
  title: Histone Deacetylase
  def: "Histone deacetylases (HDACs) are enzymes that remove small chemical tags called acetyl groups from histones, the spool-like proteins that DNA is wound around, and from other proteins. Removing these tags generally packs DNA more tightly, making nearby genes harder to read. Drugs that block HDACs (HDAC inhibitors) are used to treat some cancers and are being studied as anti-inflammatory treatments."
  wiki: Histone_deacetylase
- term: psoriasis
  title: Psoriasis
  def: "Psoriasis is a long-lasting immune-related skin disease in which skin cells multiply far faster than normal, building up into raised, red, scaly patches called plaques, often on the elbows, knees, scalp and trunk. It tends to come and go in flare-ups, which many patients say stress can trigger. It affects roughly 1–3% of people and can be treated, but not cured, with creams, ultraviolet light therapy and drugs that act on the immune system."
  wiki: Psoriasis
- term: phototherapy
  title: Phototherapy (UVB and PUVA)
  def: "Ultraviolet phototherapy treats skin diseases such as psoriasis by exposing the skin to controlled doses of ultraviolet light, usually in a booth several times a week, slowing the overgrowth of skin cells and calming inflammation. UVB therapy uses ultraviolet B light alone. PUVA (psoralen plus UVA) combines a light-sensitizing drug, psoralen, with ultraviolet A light and is often used for more severe or stubborn cases. Long courses raise the risk of skin cancer."
  wiki: Ultraviolet_light_therapy
- term: hazard_ratio
  title: Hazard Ratio
  def: "A hazard ratio compares how fast an event happens in two groups over time, such as recovery or death, at any given moment among the people it hasn't happened to yet. A hazard ratio of 2 means the event is happening at twice the rate in one group as in the other; 1 means no difference. It comes from survival analysis (often a Cox proportional hazards model), which can include people who leave a study early by counting the time they were followed."
  wiki: Hazard_ratio
- term: working_memory
  title: Working Memory
  def: "Working memory is the small, short-lived mental workspace that holds information while you use it, such as a phone number you are about to dial or the running total of a sum done in your head. It holds only a few items at once and depends on attention, so a distraction or a wandering mind can quickly empty it. Psychologists measure it with tasks such as digit span and the n-back."
  wiki: Working_memory
- term: n_back
  title: N-Back Task
  def: "The n-back task is a working memory test in which people watch a stream of items, such as letters, and say whether each one matches the item a set number of steps back (two steps in a 2-back task). Doing it well means constantly updating what you hold in mind while letting go of older items, so it demands steady attention."
  wiki: N-back
- term: stai
  title: State Anxiety Inventory
  def: "The State Anxiety Inventory is the half of the State-Trait Anxiety Inventory (STAI) that asks how anxious someone feels right now, rather than how anxious they tend to be in general. People rate 20 statements such as \"I feel worried\" from 1 (not at all) to 4 (very much so), giving a score from 20 to 80. Because it captures the moment, researchers can give it just before and just after a single session."
  wiki: State-Trait_Anxiety_Inventory
- term: study_heterogeneity
  title: Heterogeneity
  def: "In a meta-analysis, heterogeneity is how much the results of the pooled studies differ from one another beyond what chance alone would produce, for example because they enrolled different people or compared the treatment with different things. It is often summarized by the I² statistic, the share of the variation due to real differences between studies; values of 50% or more are usually read as substantial. High heterogeneity makes a single pooled number harder to interpret."
  wiki: Study_heterogeneity
- term: publication_bias
  title: Publication Bias
  def: "Publication bias arises when studies with positive or striking results are more likely to be published than studies that find nothing. A meta-analysis that pools only published studies can then overestimate how well a treatment works. Researchers check for it with tools such as funnel plots and Egger's test, which need a reasonable number of studies to be informative."
- term: white_matter
  title: White Matter
  def: "White matter is brain tissue made up mostly of long nerve fibers (axons), many wrapped in a fatty insulating layer called myelin that gives the tissue its pale color. It forms the wiring that connects regions of gray matter, within each hemisphere and between the two. In living people it is usually studied with diffusion MRI."
  wiki: White_matter
- term: diffusion_tensor_imaging
  title: Diffusion Tensor Imaging
  def: "Diffusion tensor imaging (DTI) is an MRI method that tracks how water molecules move through brain tissue. In white matter, water moves more easily along nerve fibers than across them, so DTI can map fiber pathways and estimate their structure. Its most common measure, fractional anisotropy, is often read as a sign of how intact or organized the fibers are, though several different things can change it."
  wiki: Diffusion-weighted_magnetic_resonance_imaging
- term: anterior_cingulate_cortex
  title: Anterior Cingulate Cortex
  def: "The anterior cingulate cortex (ACC) is a strip of cortex on the inner surface of each frontal lobe, curving around the front of the corpus callosum. It is involved in monitoring conflicts and errors, regulating attention and emotion, and processing pain, and it often turns up in brain-imaging studies of meditation."
  wiki: Anterior_cingulate_cortex
- term: transcendental_meditation
  title: Transcendental Meditation
  def: "Transcendental Meditation (TM) is a trademarked form of mantra meditation taught through a standardized course by certified teachers. Practitioners sit with eyes closed for about 20 minutes twice a day, silently repeating a mantra (a sound or word) in a way meant to be effortless, letting the mind settle rather than holding attention on an object. Researchers usually group it with other mantra-based techniques, separate from mindfulness meditation."
  wiki: Transcendental_Meditation
- term: confidence_interval
  title: Confidence Interval
  def: "A confidence interval is the range of values that a study's data are consistent with, given the uncertainty that comes from measuring a limited sample. A 95% confidence interval for an effect of 0.30 running from 0.00 to 0.59, for example, means the true effect could plausibly be anywhere from nothing to moderate. Narrower intervals mean more precise estimates; an interval that includes zero means the study can't rule out no effect."
  wiki: Confidence_interval
- term: perceived_stress_scale
  title: Perceived Stress Scale
  def: "The Perceived Stress Scale (PSS) is a widely used questionnaire that asks how often, over the past month, people have felt their lives were unpredictable, out of control or overloaded. It comes in 14-, 10- and 4-item versions, each answered from never (0) to very often (4); higher totals mean more stress. It measures how stressed people feel, not physical signs of stress such as hormone levels."
  wiki: Perceived_Stress_Scale
- term: region_of_interest
  title: Region of Interest
  def: "In brain imaging, a region of interest (ROI) is an area chosen in advance for testing, such as the amygdala or hippocampus, usually because earlier research points to it. Limiting the main test to one region means fewer statistical comparisons, so real effects there are easier to detect. The trade-off is that the test says nothing about the rest of the brain, so ROI studies often add a separate, exploratory whole-brain search."
  wiki: Region_of_interest
- term: meg
  title: MEG
  name: "Magnetoencephalography (MEG)"
  def: "Magnetoencephalography (MEG) records the tiny magnetic fields produced by electrical activity in the brain, using very sensitive sensors in a helmet-shaped device. Like EEG, it tracks brain activity millisecond by millisecond, but because magnetic fields pass through the skull with little distortion, it can usually locate where in the brain the activity comes from more accurately."
  wiki: Magnetoencephalography
- term: mpfc
  title: mPFC
  name: "Medial Prefrontal Cortex (mPFC)"
  def: "The medial prefrontal cortex (mPFC) is the part of the frontal lobes along the brain's midline, just behind the forehead. It is a core part of the default mode network and is consistently active when people think about themselves, judge their own traits, or recall and plan events in their own lives."
  wiki: Prefrontal_cortex
- term: inferior_parietal_lobule
  title: Inferior Parietal Lobule
  def: "The inferior parietal lobule (IPL) is a region on the outer surface of the parietal lobe, toward the back and side of the head. It combines information from the senses and the body and is involved in attention, language, the sense of being the one who causes one's own actions (agency), and telling oneself apart from others."
  wiki: Inferior_parietal_lobule
- term: intention_to_treat
  title: Intention-to-Treat Analysis
  def: "An intention-to-treat analysis counts every randomized participant in the group they were assigned to, whether or not they completed or even started the treatment. It keeps the benefit of randomization, since dropping people who didn't follow their plan can leave groups that differ in other ways, and it estimates what happens when a treatment is offered in practice rather than when it is taken exactly as intended."
  wiki: Intention-to-treat_analysis
- term: qaly
  title: Quality-Adjusted Life Year (QALY)
  def: "A quality-adjusted life year (QALY) is a measure used in health economics that combines how long people live with how well they live. A year in full health counts as 1 QALY, and a year in poorer health counts as less, based on questionnaires such as the EQ-5D. Dividing a treatment's extra cost by the QALYs it gains shows whether it is good value compared with other options."
  wiki: Quality-adjusted_life_year
- term: precuneus
  title: Precuneus
  def: "The precuneus is a region on the inner surface of the parietal lobe, toward the back of the brain's midline, next to the posterior cingulate cortex. Together they form a core hub of the default mode network, and the precuneus is often active during self-related thinking, memory recall and imagining one's own point of view."
  wiki: Precuneus
- term: individual_patient_data
  title: Individual Patient Data Meta-Analysis
  def: "An individual patient data (IPD) meta-analysis pools the raw records of every participant from several trials, rather than the summary results each trial published. Re-analyzing everyone together, the same way, lets researchers ask whether a treatment works better for some kinds of patients than others. It depends on the original trial teams sharing their data, which isn't always possible."
  wiki: Individual_participant_data
- term: p300
  title: P300
  def: "The P300 is a positive brain wave, recorded with EEG, that peaks roughly 300 to 600 milliseconds after something rare or meaningful appears, such as a target a person is watching for or a striking, personally relevant picture. It tends to be larger for things that draw more attention, so researchers use its size as a rough index of how much processing the brain gives a stimulus. It has several parts, including the P3a and the P3b."
  wiki: P300_(neuroscience)
- term: event_related_potential
  title: Event-Related Potential
  def: "An event-related potential (ERP) is the brain's electrical response to a specific event, such as a picture appearing on a screen, recorded with EEG. The response to a single event is tiny compared with the rest of the brain's activity, so researchers repeat the event many times and average the recordings until the consistent response stands out as a series of positive and negative waves at typical delays."
  wiki: Event-related_potential
- term: oddball_paradigm
  title: Oddball Task
  def: "An oddball task shows a long stream of frequent, ordinary stimuli interrupted now and then by rare ones. Some rare stimuli are targets that call for a response, such as a button press; others are distracters to be ignored. Rare stimuli trigger a P300 brain response that the frequent ones don't, which makes the task a standard way to study attention with EEG."
  wiki: Oddball_paradigm
- term: loving_kindness
  title: Loving-Kindness Meditation
  def: "Loving-kindness meditation (mettā in Pali) is a Buddhist practice of deliberately cultivating warm, unconditional goodwill. Practitioners silently repeat wishes such as \"may you be happy\" or picture a person, usually starting with themselves or someone close and then extending the wishes to acquaintances, strangers, difficult people and all beings. It is one of the four brahmaviharas."
  wiki: Mettā
- term: self_compassion
  title: Self-Compassion
  def: "Self-compassion means treating yourself with the kindness you would offer a friend when you fail or suffer. In psychologist Kristin Neff's widely used definition it has three parts: kindness toward oneself rather than harsh judgment, seeing one's difficulties as part of shared human experience rather than as isolating, and mindful awareness of painful feelings without being swept away by them. It is usually measured with Neff's Self-Compassion Scale."
  wiki: Self-compassion
- term: ecological_momentary_assessment
  title: Ecological Momentary Assessment
  def: "Ecological momentary assessment (EMA), also called experience sampling, asks people to report what they are feeling or doing several times a day, in the moment and in their everyday surroundings, usually through short surveys sent to their phones at set or random times. Because answers are given on the spot rather than recalled later, they are less colored by memory than questionnaires about the past week or month, and they can show how experiences rise and fall through the day."
  wiki: Experience_sampling_method
- term: cbt
  title: CBT
  name: "Cognitive Behavioral Therapy (CBT)"
  def: "Cognitive behavioral therapy (CBT) is a structured, usually short-term talk therapy that helps people notice and change unhelpful patterns of thinking and behavior. It is one of the most thoroughly tested psychological treatments and a first-line option for depression, anxiety disorders and many other conditions."
  wiki: Cognitive_behavioral_therapy
- term: bystander_effect
  title: Bystander Effect
  def: "The bystander effect is the finding that people are less likely to help someone in need when other people are present, especially when those others do nothing. Each person may feel less responsible, or take the others' inaction as a sign that help isn't needed. Experiments often recreate it with actors who are told to ignore the person in need."
  wiki: Bystander_effect
- term: demand_characteristics
  title: Demand Characteristics
  def: "Demand characteristics are cues in an experiment that hint at what the researchers expect, which can lead participants to behave the way they think they are supposed to rather than how they normally would. Researchers reduce them by disguising the study's purpose, measuring behavior unobtrusively, or using comparison conditions that seem just as plausible."
  wiki: Demand_characteristics
- term: empathic_accuracy
  title: Empathic Accuracy
  def: "Empathic accuracy is how well a person can correctly infer what someone else is thinking or feeling. Researchers often measure it with tests that ask people to identify the emotion shown in photographs of faces, recordings of voices or videos, and score how many they get right. It is a skill of perception, distinct from caring about the other person's feelings."
  wiki: Empathic_accuracy
- term: broaden_and_build
  title: Broaden-and-Build Theory
  def: "The broaden-and-build theory, proposed by psychologist Barbara Fredrickson in 1998, holds that positive emotions such as joy, interest and love briefly widen the range of thoughts and actions that come to mind. Over time, that broadened outlook is said to help people build lasting personal resources, such as skills, relationships, resilience and health, that serve them well later."
  wiki: Broaden-and-build
- term: hedonic_treadmill
  title: Hedonic Treadmill
  def: "The hedonic treadmill (or hedonic adaptation) is the tendency for people to get used to good and bad changes in their lives and drift back toward their usual level of happiness. A raise, a new purchase or a pleasant routine may lift mood at first, but the lift tends to fade as it becomes familiar."
  wiki: Hedonic_treadmill
- term: regression_to_the_mean
  title: Regression to the Mean
  def: "Regression to the mean is the tendency for unusually high or low measurements to be followed by ones closer to average, because part of any single measurement is chance. People who score as very stressed on a questionnaire one week will, on average, score a little less stressed the next, with or without treatment. In a trial, a group that happens to start out worse can therefore seem to improve more, which is one reason researchers compare against a control group and adjust for starting scores."
  wiki: Regression_toward_the_mean
- term: prediction_interval
  title: Prediction Interval
  def: "In a meta-analysis, a prediction interval is the range within which the true effect in a new study, run in a new setting, is likely to fall. A confidence interval describes how precisely the average effect across studies is known, and it narrows as studies accumulate. A prediction interval also takes in how much the effect genuinely varies from one setting to another, so it is wider when studies disagree. If it crosses zero, some settings may see no benefit, or even harm, even when the average effect is clearly positive."
  wiki: Prediction_interval
- term: grade_evidence
  title: GRADE
  name: "GRADE Evidence Ratings"
  def: "GRADE (Grading of Recommendations Assessment, Development and Evaluation) is a widely used system for rating how much confidence to place in a body of evidence. Reviewers rate each finding as high, moderate, low or very low certainty, downgrading it for problems such as risk of bias in the studies, inconsistent results, imprecise estimates, indirect evidence and signs that unfavorable results went unpublished. Low certainty means the true effect may be substantially different from the estimate."
  wiki: GRADE_approach
- term: pragmatic_trial
  title: Pragmatic Trial
  def: "A pragmatic trial tests how well a treatment works in everyday practice, with ordinary participants, settings and levels of attendance, rather than under the tightly controlled conditions of an explanatory trial. It shows whether offering a program helps the people it is offered to, but it usually compares the program with usual care, so it can't say which parts of the program caused any benefit."
  wiki: Pragmatic_clinical_trial
- term: number_needed_to_treat
  title: Number Needed to Treat
  def: "The number needed to treat (NNT) is how many people need to receive a treatment, or be offered it, for one more of them to avoid a bad outcome than would have without it. It is 1 divided by the difference in the share of each group that has the outcome: if 30% of an untreated group and 20% of a treated group have it, the NNT is 1 / 0.10, or 10. Lower numbers mean a bigger practical effect."
  wiki: Number_needed_to_treat
- term: meta_awareness
  title: Meta-Awareness
  def: "Meta-awareness is awareness of what the mind is doing as it happens: noticing that you are having a thought, feeling an emotion or have drifted into mind wandering, rather than simply being caught up in it. It is a form of metacognition. Mindfulness practices train it directly, for example each time a meditator notices the mind has wandered and brings attention back."
  wiki: Metacognition
- term: central_executive_network
  title: Central Executive Network
  def: "The central executive network (also called the frontoparietal control network) is a set of brain regions in the lateral prefrontal and parietal cortex, including the dorsolateral prefrontal cortex. It is active during demanding, goal-directed tasks, supporting working memory, directing attention and regulating emotion, and it tends to work in opposition to the default mode network."
  wiki: Central_executive_network
- term: act
  title: Acceptance and Commitment Therapy (ACT)
  def: "Acceptance and commitment therapy (ACT) is a form of psychotherapy that combines mindfulness and acceptance with values-based action. Rather than trying to change or get rid of difficult thoughts and feelings, people learn to notice and make room for them, clarify what matters to them, and commit to acting on those values."
  wiki: Acceptance_and_commitment_therapy
- term: nondual_awareness
  title: Nondual Awareness
  def: "Nondual awareness is a style of meditation, found in Tibetan Buddhism and other contemplative traditions, that does not focus on any particular object or experience. Instead the meditator rests in awareness itself, without splitting experience into an observing subject and the things observed, or into inner and outer. It is usually described as effortless, in contrast with practices that deliberately direct attention."
  wiki: Nondualism
- term: task_positive_network
  title: Task-Positive Network
  def: "The task-positive network is a set of brain regions, including sensory, attention and parietal areas, that become more active when a person is engaged with an external, attention-demanding task. Its activity tends to rise when the default mode network's falls, and vice versa, so the two are often described as anticorrelated or competing."
  wiki: Task-positive_network
- term: decentering
  title: Decentering
  def: "Decentering is the ability to observe thoughts, feelings and memories as passing events in the mind rather than as facts about reality or fixed parts of who you are: noticing \"I'm having the thought that I'll fail\" rather than simply believing \"I'll fail.\" It is thought to be one of the ways mindfulness-based programs and cognitive therapies work, and is usually measured by questionnaire, for example with the Experiences Questionnaire."
- term: generalized_anxiety_disorder
  title: Generalized Anxiety Disorder (GAD)
  def: "Generalized anxiety disorder (GAD) is an anxiety disorder marked by excessive, hard-to-control worry about many everyday matters, such as health, work or family, lasting at least six months. The worry comes with physical and mental symptoms such as restlessness, tiring easily, trouble concentrating, irritability, muscle tension and poor sleep."
  wiki: Generalized_anxiety_disorder
- term: bootstrapping
  title: Bootstrapping
  name: "Bootstrapping (Statistics)"
  def: "Bootstrapping is a statistical technique that gauges how uncertain a result is by resampling the data. It draws thousands of new samples of the same size from the original participants (with replacement), recalculates the result in each, and uses the spread of those results to build a confidence interval. It makes fewer assumptions about the shape of the data than traditional tests and is commonly used to test indirect effects in mediation analysis."
  wiki: Bootstrapping_(statistics)
- term: vmpfc
  title: vmPFC
  name: "Ventromedial Prefrontal Cortex (vmPFC)"
  def: "The ventromedial prefrontal cortex (vmPFC) is the lower part of the frontal lobes along the brain's midline, just above the eyes. Together with the neighboring medial orbitofrontal cortex and the subgenual (lower) part of the anterior cingulate, it helps weigh how much something matters to oneself, represents reward and value, and links emotions with the body's internal states."
  wiki: Ventromedial_prefrontal_cortex
- term: angular_gyrus
  title: Angular Gyrus
  def: "The angular gyrus is a region in the back of the parietal lobe, part of the inferior parietal lobule, where information from vision, hearing and touch comes together. It is involved in language, attention, memory and in taking perspectives, including switching between seeing a situation from one's own point of view and from the outside."
  wiki: Angular_gyrus
- term: dorsal_attention_network
  title: Dorsal Attention Network
  def: "The dorsal attention network (DAN) is a set of brain regions toward the top of the parietal lobes (around the intraparietal sulcus) and in the frontal lobes (the frontal eye fields). It directs attention voluntarily toward whatever a person has chosen to focus on, especially in the outside world, and its activity tends to rise and fall in opposition to the default mode network."
  wiki: Dorsal_attention_network
- term: heart_rate_variability
  title: Heart Rate Variability
  def: "Heart rate variability (HRV) is the natural variation in time between one heartbeat and the next, calculated from an ECG or a pulse sensor. Higher HRV at rest usually reflects a stronger parasympathetic (\"rest and digest\") influence on the heart and is generally linked to relaxation, better health and more flexible responses to stress."
  wiki: Heart_rate_variability
- term: mahamudra
  title: Mahāmudrā
  def: "Mahāmudrā (Sanskrit for \"great seal\") is a body of teachings and meditation practices in Tibetan Buddhism, central to the Kagyü school. It aims at direct recognition of the nature of the mind itself, often described as open, clear awareness that is not centered on a self."
  wiki: Mahamudra
- term: sense_of_agency
  title: Sense of Agency
  def: "The sense of agency is the feeling of being the one who initiates and controls an action, such as moving your hand or, in meditation, directing your attention. It is usually so constant that it goes unnoticed, but it can weaken or disappear in some psychiatric and neurological conditions and in some deep meditative states."
  wiki: Sense_of_agency
- term: principal_component_analysis
  title: Principal Component Analysis
  def: "Principal component analysis (PCA) is a statistical method that looks for a small number of underlying dimensions that account for most of the variation in many related measurements. If several measures rise and fall together, PCA can show that they largely reflect one shared factor."
  wiki: Principal_component_analysis
- term: inter_rater_reliability
  title: Inter-Rater Reliability
  def: "Inter-rater reliability is how closely two or more people agree when they independently rate or classify the same material, such as interview transcripts. Measures such as Cohen's kappa correct for the agreement expected by chance: 0 means chance-level agreement and 1 perfect agreement."
  wiki: Inter-rater_reliability
- term: body_scan
  title: Body Scan
  def: "The body scan is a meditation practice in which attention is moved slowly through the body, part by part, noticing whatever sensations are present without trying to change them. It is a core exercise in mindfulness programs such as MBSR."
  wiki: Body_scan
- term: interoception
  title: Interoception
  def: "Interoception is the sense of the body's internal state: feeling your heartbeat, breathing, hunger, warmth, tension and other sensations from inside the body. Interoceptive awareness is how much attention a person pays to these signals. Practices such as the body scan, which moves attention through the body part by part, aim to strengthen it."
  wiki: Interoception
- term: psychedelic_drug
  title: Psychedelic Drugs
  def: "Classic psychedelics are drugs such as psilocybin (the active compound in \"magic mushrooms\"), LSD, mescaline and DMT that profoundly alter perception, emotion and the sense of self, mainly by stimulating the brain's serotonin 2A receptors. They are being studied as possible treatments for conditions such as depression and addiction, mostly in carefully controlled clinical settings, and are controlled substances in most countries."
  wiki: Psychedelic_drug
- term: ego_dissolution
  title: Ego Dissolution
  def: "Ego dissolution (also called ego death) is a temporary loss of the ordinary sense of being a separate self, often described as the boundary between self and world melting away, sometimes with a feeling of oneness. It is reported at high doses of psychedelic drugs and in some deep meditative states, and researchers usually measure it with questionnaires."
  wiki: Ego_death
- term: samadhi
  title: Samadhi
  def: "Samadhi is a state of deep meditative absorption, or one-pointed concentration, described in Hindu and Buddhist traditions. In Buddhism it is closely tied to the jhanas, a series of increasingly refined absorption states. Its deepest stages are described as having almost no content: no thoughts, no pleasure or pain, and no sense of an individual self."
  wiki: Samadhi
- term: extinction
  title: Extinction (Learning)
  def: "In psychology, extinction is the fading of a learned reaction when its trigger stops predicting what it used to, for example when a place once linked with danger is repeatedly experienced as safe. Extinction doesn't erase the original memory; it adds new learning that competes with it, which is why old fears can return. Exposure therapies for anxiety rely on it."
  wiki: Extinction_(psychology)
- term: memory_reconsolidation
  title: Memory Reconsolidation
  def: "Memory reconsolidation is the process by which a memory, when recalled, briefly becomes changeable before it is stored again. During that window it can be updated, weakened or linked to new associations. Researchers study it as a way to change emotional memories, for example in anxiety and addiction."
  wiki: Memory_reconsolidation
- term: tummo
  title: g-Tummo
  name: "g-Tummo (Tummo)"
  def: "g-Tummo, often written tummo and known in English as \"inner fire\" or \"psychic heat,\" is a meditation practice of Tibetan Buddhism and Bön associated with sensations of intense bodily heat. It combines a breath-holding technique with muscle contractions (\"vase breathing\") and visualization of flames in the body, and it is traditionally taught in long retreats."
  wiki: Tummo
- term: isometric_exercise
  title: Isometric Exercise
  def: "An isometric exercise tenses muscles without moving the joints they act on, as in holding a plank or pressing the palms together. The muscles work and produce heat even though the body stays still."
  wiki: Isometric_exercise
- term: thermogenesis
  title: Thermogenesis
  def: "Thermogenesis is the body's production of heat. Muscle activity, including shivering and other muscle contractions, is a major source; the body also makes heat by burning fuel in brown fat and through digestion."
  wiki: Thermogenesis
- term: delta
  title: Delta
  name: "Delta Waves"
  def: "Delta waves are the slowest rhythmic electrical brain activity recorded with EEG, at roughly 0.5–4 cycles per second. They dominate deep (slow-wave) sleep and also appear under general anesthesia, so more delta while awake can be a sign of drowsiness. Smaller amounts are present in waking EEG, where they have also been linked to attention and internal processing."
  wiki: Delta_wave
- term: false_discovery_rate
  title: False Discovery Rate
  def: "The false discovery rate (FDR) is the expected share of false positives among the results a study declares significant. FDR corrections, such as the Benjamini–Hochberg method, are a common way to handle multiple comparisons. They are less strict than corrections that try to avoid even a single false positive (such as Bonferroni), so they miss fewer real effects, while accepting that a small fraction of the reported findings may be due to chance."
  wiki: False_discovery_rate
- term: dynamic_functional_connectivity
  title: Dynamic Functional Connectivity
  def: "Dynamic functional connectivity tracks how the coordination between brain regions changes from moment to moment, rather than averaging it over a whole scan. Researchers typically measure connectivity in short, sliding windows of fMRI data, then group similar windows into a few recurring patterns, often called brain states, and count how often each appears and how long it lasts."
  wiki: Dynamic_functional_connectivity
- term: thalamus
  title: Thalamus
  def: "The thalamus is a pair of egg-shaped structures deep in the middle of the brain that relay sensory signals (from everything except smell) and motor signals to the cerebral cortex. It acts as a gatekeeper, helping decide which information reaches the cortex, and also plays a part in regulating sleep, wakefulness and attention."
  wiki: Thalamus
- term: tukdam
  title: Tukdam
  def: "Tukdam (Tibetan thugs dam, also spelled thukdam) is a state that Tibetan Buddhists believe some advanced meditators enter at death, remaining in meditation after breathing has stopped. According to the tradition, the body of someone in tukdam stays fresh, with supple skin and warmth around the heart, and doesn't begin to decay for days or even weeks. The state is understood to have ended when signs of decomposition appear."
  wiki: Tukdam
- term: mismatch_negativity
  title: Mismatch Negativity
  def: "The mismatch negativity (MMN) is a brain response, recorded with EEG, to a sound that breaks a repeating pattern, such as a change in pitch after a run of identical tones. It shows up as a negative dip roughly 100 to 300 milliseconds after the odd sound and arises automatically, even when the person isn't paying attention, so it is used to test whether the brain still processes sound during sleep, in coma or in a vegetative state."
  wiki: Mismatch_negativity
- term: auditory_brainstem_response
  title: Auditory Brainstem Response
  def: "The auditory brainstem response (ABR) is a series of tiny electrical waves, recorded from the scalp, that the hearing nerve and brainstem produce within about 10 milliseconds of a click. Because it doesn't depend on attention or awareness, it is used to test hearing in newborns and to check whether the brainstem is still working in people in a deep coma or suspected of brain death."
  wiki: Auditory_brainstem_response
- term: out_of_body_experience
  title: Out-of-Body Experience
  def: "An out-of-body experience (OBE) is the feeling of being located outside one's own physical body, often seeing it from above or from across the room. OBEs are reported in deep meditation, near-death experiences, sleep paralysis and some neurological conditions, and can be triggered by stimulating the temporoparietal junction, a region that helps place the sense of self in the body."
  wiki: Out-of-body_experience
- term: cerebellum
  title: Cerebellum
  def: "The cerebellum (\"little brain\") is a densely packed structure at the back of the brain, beneath the main hemispheres. It is best known for coordinating movement and balance, using signals from the inner ear and the body, but it also contributes to timing, attention and other mental functions."
  wiki: Cerebellum
- term: cessation
  title: Cessation
  name: "Cessation (Nirodha)"
  def: "In Buddhist meditation, a cessation (Pali nirodha) is a complete gap in experience reported by some very advanced meditators: for a moment, consciousness itself seems to switch off and then return, with almost no sense of time having passed, often followed by a feeling of unusual clarity. Theravada teachings link brief cessations to the last of the stages of insight, called fruition, and also describe a longer attainment, nirodha samāpatti. Science has studied cessations in only a handful of meditators."
  wiki: Nirodha-samāpatti
- term: near_death_experience
  title: Near-Death Experience
  def: "A near-death experience (NDE) is a pattern of vivid experiences that some people report after coming close to death, for example during a cardiac arrest, or believing they were. Common features include a sense of leaving the body, moving through a tunnel, meeting a being of light or people who have died, reviewing one's life and losing the sense of time and space. Researchers usually identify NDEs with questionnaires such as Greyson's Near-Death Experience Scale, and what causes them is still debated."
  wiki: Near-death_experience
- term: mystical_experience
  title: Mystical Experience
  def: "A mystical experience is an experience, often described as religious or spiritual, of unity with everything, loss of the usual sense of self, timelessness, deep positive feeling and a sense of having glimpsed a deeper truth, which is typically felt to be hard to put into words. Researchers measure it with questionnaires such as Hood's Mysticism Scale. Such experiences are reported in meditation and prayer, and after taking psychedelic drugs."
  wiki: Mystical_or_religious_experience
- term: non_attachment
  title: Non-Attachment
  def: "In Buddhist psychology, non-attachment is freedom from clinging: being able to engage with experiences, people and things without needing to hold on to them, and to let them go when they change or end. It is not the same as indifference or emotional detachment. Researchers measure it with questionnaires such as the Non-Attachment Scale, on which higher scores mean less clinging."
  wiki: Nonattachment_(philosophy)
- term: nimitta
  title: Nimitta
  def: "In Theravada Buddhist meditation, a nimitta (Pali for \"sign\") is a mental image that is said to appear once concentration has developed, often while focusing on the breath. It is commonly described as a light, such as a star, a cluster of gems or the disk of the moon. Teachers treat it as a sign of deepening concentration, and it can become the new object of attention on the way to the jhanas."
  wiki: Nimitta
- term: sensory_deprivation
  title: Sensory Deprivation
  def: "Sensory deprivation is the deliberate reduction of input to the senses, for example by sitting in a dark, silent room, wearing blindfolds and earplugs, or floating in a lightless tank. Even short periods can change perception, including simple visual hallucinations such as spots or flashes of light."
  wiki: Sensory_deprivation
- term: perceptual_isolation
  title: Perceptual Isolation
  name: "Perceptual Isolation (Ganzfeld)"
  def: "Perceptual isolation, studied as the Ganzfeld effect, means exposing someone to an unchanging, featureless field of sight or sound, such as an even wash of light over both eyes with steady white noise. The senses still receive input, but the brain habituates and filters it out, and people often begin to see lights, patterns or images that aren't there."
  wiki: Ganzfeld_effect
- term: charles_bonnet_syndrome
  title: Charles Bonnet Syndrome
  def: "Charles Bonnet syndrome is a condition in which people with poor vision or blindness, most often older adults, see things that aren't there, from spots, flashes and patterns to faces or scenes. It is not a sign of mental illness, and people usually know the images aren't real. It is thought to arise when visual areas of the brain, deprived of input, become overactive."
  wiki: Visual_release_hallucinations
- term: homeostatic_plasticity
  title: Homeostatic Plasticity
  def: "Homeostatic plasticity is a set of feedback mechanisms that keep neurons' activity near a stable level. If a neuron receives less input, it becomes more excitable, for example by strengthening its connections; if it receives too much, it becomes less excitable. When sensory input drops sharply, this compensation can overshoot and cause spontaneous firing."
  wiki: Homeostatic_plasticity
- term: occipital_lobe
  title: Occipital Lobe
  def: "The occipital lobe, at the back of the brain, is the brain's main center for vision. Its outer layer, the occipital or visual cortex, receives signals from the eyes and analyzes features such as edges, color and movement."
  wiki: Occipital_lobe
- term: hypnagogia
  title: Hypnagogia
  def: "Hypnagogia is the drowsy state between wakefulness and sleep. Experiences that arise in it, called hypnagogic hallucinations, are very common: dream-like images, sounds, or a sudden feeling of falling as a person drifts off. They are usually harmless."
  wiki: Hypnagogia
- term: factor_analysis
  title: Factor Analysis
  def: "Factor analysis is a statistical method for finding a smaller number of underlying dimensions, called factors, behind answers to many questions. Questions that people tend to answer in similar ways are grouped onto the same factor. Researchers choose how many factors to keep and name them by the questions that load on each, so the result involves judgment as well as arithmetic."
  wiki: Factor_analysis
- term: cronbachs_alpha
  title: Cronbach's Alpha
  def: "Cronbach's alpha is a measure of how consistently a set of questionnaire items measures the same thing, based on how strongly people's answers to them go together. It runs from 0 to 1; values of about 0.7 or higher are usually considered acceptable for research."
  wiki: Cronbach%27s_alpha
- term: zen
  title: Zen
  def: "Zen is a school of Mahayana Buddhism that developed in China (as Chan) and spread to Japan, Korea and Vietnam. Its central practice is seated meditation (zazen), such as shikantaza, \"just sitting\" in open awareness without a particular object, or working with koans, paradoxical questions meant to cut through ordinary conceptual thinking."
  wiki: Zen
